<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183b36"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='9' fill='%23164c43'/%3E%3Cpath d='M7 25l9-16h6l-9 16zm11 0 7-12h5l-7 12z' fill='%23d8fc81'/%3E%3C/svg%3E"><title>Flowstate · Simulation studio</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="studio.css"></head><body>
<header><a class="brand" href="#studio" aria-label="Flowstate studio"><svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#164c43"/><path d="M7 25l9-16h6l-9 16zm11 0 7-12h5l-7 12z" fill="#d8fc81"/></svg>Flowstate</a><span class="headsep"></span><nav aria-label="Workspace"><button id="workspaceNav" class="nav active"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6l9-4 9 4-9 5z M3 6v11l9 5 9-5V6 M12 11v11" /></svg>Studio</button><button id="projects" class="nav"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v12H3z" /></svg>Projects</button><button id="products" class="nav"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h6v6H4z M14 5h6v6h-6z M9 15h6v6H9z" /></svg>Products</button><button id="workStudy" class="nav"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14v16H5z M9 3h6v4H9z M8 11h8 M8 15h6" /></svg>Work study</button><button id="experiments" class="nav"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3h8 M10 3v7l-6 9q0 2 2 2h12q2 0 2-2l-6-9V3 M7 15h10" /></svg>Experiments</button></nav><span class="save" id="save" role="status"></span></header>
<main id="studio"><div class="breadcrumb">Workspace <b>/</b> Simulation studio</div><div class="titlebar"><div><h1 id="title"></h1><p id="category"></p></div><div class="actions"><button id="qualityOpen">Quality lab</button><button id="workers">Worker lab</button><button id="settings">Run setup</button><button id="run" class="primary">▶ &nbsp; Run simulation</button></div></div>
<section class="runstrip" aria-label="Run snapshot"><div class="runstate"><i id="runSignal"></i><div><span>Run snapshot</span><strong id="runState">Ready to model</strong></div></div><div class="runfacts" id="runFacts"><span>2D editor active</span><span>No simulation yet</span><span>Run when the model is connected</span></div></section>
<section class="workspace"><div class="modelpane"><div class="panelhead"><div class="switch" aria-label="Model view"><button id="view3d">3D floor</button><button id="view2d">2D editor</button></div><div><button id="undo" aria-label="Undo" title="Undo">↶</button><button id="redo" aria-label="Redo" title="Redo">↷</button><button id="link" aria-pressed="false">Connect</button><button id="add">＋ Station</button></div></div>
<div class="stage" id="stage"><canvas id="factory" tabindex="0" aria-label="3D process floor. Use station selector in inspector to select equipment."></canvas><div class="stagetitle"><i></i> <span id="stageStatus">Factory floor</span></div><select id="floorLayer" aria-label="Floor analysis layer"><option value="live">Live equipment</option><option value="load">Station utilization</option><option value="Present">Present study route</option><option value="Proposed">Proposed study route</option></select><button id="focusStation" class="focusstation">Station close-up</button><button id="expandFloor" aria-pressed="false">Expand floor</button><div id="observerHud" hidden><strong id="observerTitle"></strong><span id="observerTask"></span><progress id="observerProgress" max="1" value="0" aria-label="Activity progress"></progress></div><button id="fit" class="fit">Reset view</button></div>
<div class="scroll" id="two" hidden><svg id="graph" viewBox="0 0 820 365" role="group" aria-label="Process canvas. Select a station to edit it."></svg></div>
<section id="qualityDeck" class="quality-deck" hidden><div><small>QUALITY CONTROL</small><strong id="qualityStatus"></strong></div><div><button id="nextFault">Replay next incident</button><button id="qualityReview">Review shift</button></div></section><div id="crewReplay" class="crew-replay" hidden><label>Camera <select id="followWorker" aria-label="Follow worker"></select></label><button id="nextActivity">Next activity</button><button id="markObservation">Start observation</button><button id="workerChart">Worker chart</button></div><div class="transport"><button id="play" aria-label="Play or pause replay">▶</button><strong id="clock">00:00</strong><input id="scrub" aria-label="Simulation time" type="range" min="0" max="3600" value="0" step="1"><select id="speed" aria-label="Playback speed"><option>1</option><option>10</option><option selected>60</option><option>240</option></select><span>×</span></div>
<div class="canvasfoot"><div class="modelmeta"><span><i></i> <span id="count"></span></span><div id="productLegend" class="product-legend" aria-label="Product flows"></div></div><button id="checks">Check model</button></div></div>
<aside><div class="panelhead"><h2>Station inspector</h2></div><div class="stationpick"><label for="stationPick">Selected station</label><select id="stationPick"></select></div><div id="inspect"></div><button id="measure">Measure station time ↗</button></aside></section>
<section class="analysis"><div class="reporttitle"><h2>Run results</h2><div class="reportactions"><span id="windowNote"></span><button id="report">Export report</button></div></div><div class="metrics" id="metrics"></div><div id="details" class="resultpanel"></div></section>
<details class="ideal"><summary>Ideal line capacity</summary><div class="metrics" id="idealMetrics"></div></details>
<div role="status" id="notice" aria-live="polite"></div><dialog id="dialog"><div class="dialoghead"><h2 id="dialogtitle"></h2><button id="close" aria-label="Close">×</button></div><div id="dialogbody"></div></dialog></main><script type="module" src="app.mjs"></script></body></html>
