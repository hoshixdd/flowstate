nd(n=>n.id===id)?.name||'Removed station')+' · '+e(format(s))+' s').join(' / ')+'\u003c/p>\u003cbutton id=\"ws-replay\">Run this method\u003c/button>\u003c/section>':'')+\n      '\u003cdiv class=\"ws-tools\">\u003cbutton id=\"ws-copy\">Copy present worksheet to proposed\u003c/button>\u003cbutton id=\"ws-print\">Print study report\u003c/button>\u003cbutton id=\"ws-save\" class=\"primary\">Save study\u003c/button>\u003c/div>\u003csmall id=\"ws-status\" role=\"status\">\u003c/small>\u003c/section>');\n    \n    id('lab').addEventListener('click',ev=>{if(ev.target.closest('button')&&!['ws-save','ws-replay','ws-apply','ws-print'].includes(ev.target.id))checkpoint();});\n    id('topic').onchange=ev=>{watchStart=null;topic=ev.target.value;refresh();};id('method').onchange=ev=>{watchStart=null;method=ev.target.value;refresh();};\n    if(id('station')&&topic!=='layout')id('station').onchange=()=>{station=id('station').value;};\n    if(id('capture'))id('capture').onclick=()=>{\n      draft[method].stationTimes=Object.fromEntries(model.nodes.filter(n=>['processor','inspection'].includes(n.type)).map(n=>[n.id,n.seconds]));\n      draft[method].crew=model.crew?structuredClone(model.crew):null;\n      draft[method].evidence={completed:run.completed,rate:run.throughput,cost:run.cost,config:structuredClone(run.config),bottleneck:run.rows.find(r=>r.id===run.bottleneck)?.name||'—'};\n      refresh();id('status').textContent='Run captured. Save study to keep this evidence.';\n    };\n    if(id('import'))id('import').onclick=()=>{\n      try{\n        if(id('person')){workerId=Number(id('person').value);from=id('from').valueAsNumber;to=id('to').valueAsNumber;}\n        const data=simulationWorksheet(topic,model,run,id('station')?.value||station,workerId,from,to);\n        if(data.rows?.length&&t.rows.length&&!confirm('Replace these worksheet rows with simulation data?'))return;\n        if(data.observations&&t.observations&&!confirm('Replace the listed cycle times with simulated cycles?'))return;\n        Object.assign(t,data);refresh();id('status').textContent=t.provenance;\n      }catch(err){id('status').textContent=err.message;}\n    };\n    if(id('watch'))id('watch').onclick=()=>{\n      if(watchStart===null)watchStart=performance.now();\n      else{const seconds=((performance.now()-watchStart)/1000).toFixed(3);t.observations=[t.observations,seconds].filter(Boolean).join(', ');watchStart=null;}\n      refresh();\n    };\n    id('lab').oninput=ev=>{const {row,key}=ev.target.dataset;if(!key)return;(row==null?t:t.rows[Number(row)])[key]=ev.target.value;id('output').innerHTML=safeOutput(topic,t,method);id('status').textContent='Unsaved changes';checkpoint();};\n    id('lab').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{t.rows.splice(Number(b.dataset.remove),1);refresh();});\n    if(id('add'))id('add').onclick=()=>{t.rows.push(Object.fromEntries(cols.map(([k,,type,v])=>[k,v??(Array.isArray(type)?type[0]:'')])));refresh();};\n    if(id('point'))id('point').onclick=()=>{const n=model.nodes.find(n=>n.id===id('station').value);if(n)t.rows.push({x:n.x,y:n.y,label:n.name});refresh();};\n    if(topic==='layout')id('output').onclick=ev=>{\n      const plan=ev.target.closest('svg');if(!plan)return;\n      const point=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(plan.getScreenCTM().inverse());\n      t.rows.push({x:Math.round(point.x),y:Math.round(point.y),label:'Waypoint '+(t.rows.length+1)});checkpoint();refresh();\n    };\n    if(id('use'))id('use').onclick=()=>{t.output=run.completed;t.provenance='Simulation output · seed '+run.config.seed+' · '+run.config.warmup+'–'+run.config.horizon+' s';refresh();};\n    id('copy').onclick=()=>{if(draft.Proposed[topic]&&!confirm('Replace the proposed worksheet with the present one?'))return;draft.Proposed[topic]=structuredClone(get(topic,'Present'));method='Proposed';refresh();};\n    id('save').onclick=()=>{commit(()=>{model.workStudy=structuredClone(draft);},true);discardDraft();id('status').textContent='Study saved with this project.';};\n    if(id('replay'))id('replay').onclick=()=>{\n      const times=methodTimes(method);\n      commit(()=>{model.workStudy=structuredClone(draft);if(Object.hasOwn(draft[method],'crew'))model.crew=structuredClone(draft[method].crew);for(const n of model.nodes)if(['processor','inspection'].includes(n.type)&&Number.isFinite(times[n.id])&&times[n.id]>=.001&&times[n.id]\u003c=604800)n.seconds=times[n.id];});\n      discardDraft();document.getElementById('dialog').close();rerun();\n    };\n    if(id('apply'))id('apply').onclick=()=>{try{const seconds=(topic==='timing'?duration(t):standardFromData(t)).standard;if(seconds\u003c0.001||seconds>604800)throw Error('Station time must be between 0.001 and 604800 seconds.');const n=model.nodes.find(n=>n.id===id('station').value);draft[method].stationTimes={...Object.fromEntries(model.nodes.filter(n=>['processor','inspection'].includes(n.type)).map(n=>[n.id,n.seconds])),...methodTimes(method),[n.id]:seconds};commit(()=>{model.workStudy=structuredClone(draft);for(const st of model.nodes)if(Object.hasOwn(methodTimes(method),st.id))st.seconds=methodTimes(method)[st.id];});discardDraft();document.getElementById('dialog').close();notify('Applied '+format(seconds)+' s to '+n.name+'. Running updated model.');rerun();}catch(err){id('status').textContent=err.message;}};\n    id('print').onclick=()=>{\n      const win=window.open('','_blank');if(!win){id('status').textContent='Allow a new window to print.';return;}\n      const blocks=methods.filter(m=>draft[m].evidence).map(m=>{const v=draft[m].evidence;return '\u003cp>\u003cb>'+e(m)+' simulation\u003c/b> · '+e(v.completed)+' completed · '+e(format(v.rate))+' units/h · seed '+e(v.config.seed)+' · '+e(v.config.warmup)+'–'+e(v.config.horizon)+' s · bottleneck '+e(v.bottleneck)+'\u003c/p>';});for(const m of methods)for(const [k,data] of Object.entries(draft[m])){\n        if(!Object.hasOwn(topics,k))continue;const fs=fields[k]||[],cs=columns[k]||[];\n        blocks.push('\u003csection>\u003ch2>'+e(m)+' · '+e(topics[k][0])+'\u003c/h2>'+fs.map(([id,label])=>'\u003cp>\u003cb>'+e(label)+'\u003c/b> '+e(data[id])+'\u003c/p>').join('')+(data.rows?.length?'\u003ctable>\u003ctr>\u003cth>#\u003c/th>'+cs.map(c=>'\u003cth>'+e(c[1])+'\u003c/th>').join('')+'\u003c/tr>'+data.rows.map((r,i)=>'\u003ctr>\u003ctd>'+(i+1)+'\u003c/td>'+cs.map(c=>'\u003ctd>'+e(r[c[0]])+'\u003c/td>').join('')+'\u003c/tr>').join('')+'\u003c/table>':'')+safeOutput(k,data,m)+'\u003cp>'+e(data.provenance||'')+'\u003c/p>\u003c/section>');\n      }\n      const discussion=methods.flatMap(m=>Object.entries(draft[m]).filter(([k,t])=>topics[k]&&t.discussion).map(([k,t])=>'\u003ch3>'+e(m)+' · '+e(topics[k][0])+'\u003c/h3>\u003cp>'+e(guides[k])+'\u003c/p>\u003cp>'+e(t.discussion)+'\u003c/p>')).join('');\n      win.document.write('\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003ctitle>Work study report\u003c/title>\u003cstyle>body{font:14px system-ui;color:#163e33;margin:2em}table{border-collapse:collapse;width:100%}td,th{padding:5px;border:1px solid #aaa}h2{break-after:avoid}tr,svg{break-inside:avoid}\u003c/style>\u003ch1>'+e(model.title)+' · Work study\u003c/h1>'+blocks.join('')+(discussion?'\u003ch2>Discussion\u003c/h2>'+discussion:''));win.document.close();win.focus();win.print();\n    };\n  }\n  refresh();if(recovered)id('status').textContent='Recovered your worksheet draft. Save study to include it in this project.';\n}\n","model.mjs":"export const kinds = {source:'Source',processor:'Processor',queue:'Queue',inspection:'Inspection',sink:'Sink'};\nexport const fixtures={\n  mixer:['Mix or knead',240,false],proofer:['Proofing rack',1800,true],oven:['Batch oven',900,true],cooling:['Cooling rack',360,true],\n  press:['Printing press',38,true],binder:['Trim and crease',26,false],washer:['Washer',600,true],dryer:['Drying drum',420,true],fold:['Folding table',210,false],\n  workbench:['Manual workbench',30,false],filler:['Dosing hopper',24,false],sealer:['Sealing machine',18,false],vision:['Inspection bench',15,false]\n};\nexport const templates = {\n  bakery:{title:'Bread roll bakery',category:'Bakery production study'},\n  printshop:{title:'Print finishing shop',category:'Print production study'},\n  laundry:{title:'Linen finishing room',category:'Laundry production study'},\n  materials:{title:'Carton supply and lot study',category:'Material flow lab'},\n  walking:{title:'Packing aisle layout study',category:'Measured walking lab'},\n  roles:{title:'Packing crew assignment study',category:'Station assignment lab'},\n  quality:{title:'Carton quality line',category:'Factory quality study'},\n  lab:{title:'Assembly line',category:'IE classroom lab',names:['Arrivals','Preparation','Assembly','Packaging','Finished units'],times:[30,30,45,36,0]},\n  staffed:{title:'Staffed packing factory',category:'Worker measurement lab',names:['Receiving','Prepare cartons','Fill cartons','Inspect and seal','Dispatch'],times:[30,25,40,22,0]},\n  production:{title:'Choco Bomb production',category:'Small production',names:['Ingredients','Mixing','Shaping','Packing','Finished boxes'],times:[40,35,55,40,0]},\n  campus:{title:'Campus service queue',category:'Campus services',names:['Student arrivals','Check-in','Document review','Release','Students served'],times:[120,60,180,90,0]}\n};\nexport function template(key){\n if(['bakery','printshop','laundry'].includes(key)){\n   const recipes={\n     bakery:{unit:'Tray',interval:300,steps:['mixer','proofer','oven','cooling'],names:['Mix dough','Proof trays','Bake rolls','Cool trays'],target:'oven',defect:'Dark crust',type:'high',threshold:205,setting:215,rate:38,normal:4,end:'Packed trays',reject:'Reject assessment'},\n     printshop:{unit:'Print job',interval:45,steps:['workbench','press','binder'],names:['Prepare job','Print sheets','Trim and crease'],target:'binder',defect:'Off-centre cut',type:'restart',threshold:180,rate:35,normal:3,end:'Finished jobs',reject:'Reprint bench'},\n     laundry:{unit:'Linen load',interval:180,steps:['washer','dryer','fold'],names:['Wash loads','Dry linen','Fold and stack'],target:'fold',defect:'Creased linen',type:'wait',threshold:90,rate:32,normal:3,end:'Finished loads',reject:'Refinish linen'}\n   },r=recipes[key],base=template('quality'),slots=[[216,48],[450,48],[690,48],[690,202]];\n   const source={...base.nodes[0],name:'Receiving',x:12,y:48,seconds:r.interval};\n   const steps=r.steps.map((id,i)=>({id,name:r.names[i],type:'processor',fixture:id,x:slots[i][0],y:slots[i][1],seconds:fixtures[id][1],unattended:fixtures[id][2],servers:({proofer:6,cooling:2,washer:4,dryer:3})[id]??1}));\n   const target=steps.find(n=>n.id===r.target);\n   target.setting=r.setting??0;\n   if(key==='printshop')target.reliability={life:650,repair:90,pmAge:0,pmTime:0};\n   const gate={...base.nodes.find(n=>n.id==='vision'),name:'Final inspection',x:445,y:222,seconds:20};\n   const repair={...base.nodes.find(n=>n.id==='repair'),name:r.reject,x:450,y:368};\n   const sink={...base.nodes.at(-1),name:r.end,x:160,y:222};\n   const chain=[source,...steps,gate,sink];\n   return {...base,...templates[key],crew:{count:2,speed:1.2,scale:.65},nodes:[...chain,repair],edges:[...chain.slice(1).map((n,i)=>[chain[i].id,n.id]),[gate.id,repair.id],[repair.id,sink.id]],\n     products:[{...base.products[0],id:'unit',name:r.unit,interval:r.interval}],\n     quality:{...base.quality,recovery:key==='bakery'?0:90,modes:[{id:'process-defect',name:r.defect,station:target.id,rate:r.normal,condition:{type:r.type,threshold:r.threshold,rate:r.rate}}]}};\n }\n if(key==='materials'){\n   const model=template('quality');\n   return {...model,...templates.materials,supply:{name:'Carton blank',lots:[\n     {id:'BLANK-A',at:0,quantity:30},{id:'BLANK-B',at:1800,quantity:150}\n   ]}};\n }\n if(key==='walking'){\n   const model=template('roles');\n   return {...model,...templates.walking,walkingRoutes:[{from:'n1',to:'n2',via:[[307/36,10.5],[578/36,10.5]],metres:22}]};\n }\n if(key==='roles'){\n   const model=template('staffed');\n   return {...model,...templates.roles,crew:{...model.crew,roster:[\n     {role:'Packing operator',stations:['n1','n2']},\n     {role:'Inspector',stations:['n3']}\n   ]}};\n }\n if(key==='quality'){\n   const layout=[\n     ['receiving','Inbound pallets','source',36,42,20],\n     ['forming','Carton former','processor',268,42,15],\n     ['filler','Dosing hopper','processor',502,42,24],\n     ['sealer','Case sealer','processor',692,170,18],\n     ['vision','Inspection gate','inspection',475,232,12],\n     ['repair','Rework bench','processor',472,355,36],\n     ['shipping','Dispatch pallets','sink',160,232,0]\n   ];\n   return {version:1,title:templates.quality.title,category:templates.quality.category,crew:{count:5,speed:1.2,scale:.6},\n     nodes:layout.map(([id,name,type,x,y,seconds])=>({id,fixture:id,name,type,x,y,seconds})),\n     edges:[['receiving','forming'],['forming','filler'],['filler','sealer'],['sealer','vision'],['vision','shipping'],['vision','repair'],['repair','shipping']],\n     products:[{id:'carton',name:'Carton',color:'#e7ad64',interval:20,distribution:'fixed',route:[]}],\n     quality:{gate:'vision',repair:'repair',detection:85,recovery:90,modes:[\n       {id:'fold',name:'Crushed fold',station:'forming',rate:5},\n       {id:'dose',name:'Incorrect fill',station:'filler',rate:13},\n       {id:'seal',name:'Open seam',station:'sealer',rate:8}\n     ]}};\n }\n const t=templates[key], positions=[[36,64],[307,64],[578,64],[578,226],[307,226]];\n return {...(key==='staffed'?{crew:{count:2,speed:1.2,scale:1}}:{}),version:1,title:t.title,category:t.category,nodes:t.names.map((name,i)=>({id:'n'+i,name,type:i===0?'source':i===4?'sink':'processor',seconds:t.times[i],x:positions[i][0],y:positions[i][1]})),edges:[['n0','n1'],['n1','n2'],['n2','n3'],['n3','n4']],products:[{id:'unit',name:'Unit',color:'#d8fc81',interval:t.times[0],distribution:'fixed',route:[]}]};\n}\nexport function inspect(m){\n const issues=[],nodes=m.nodes, ids=new Set(nodes.map(n=>n.id)), source=nodes.filter(n=>n.type==='source'), sink=nodes.filter(n=>n.type==='sink');\n if(source.length!==1)issues.push('Use exactly one source.');\n if(sink.length!==1)issues.push('Use exactly one sink.');\n for(const n of nodes){\n  const incoming=m.edges.filter(e=>e[1]===n.id).length,outgoing=m.edges.filter(e=>e[0]===n.id).length;\n  if(!n.name.trim())issues.push('Give each station a name.');\n  if(n.type!=='queue'&&n.type!=='sink'&&!(Number.isFinite(n.seconds)&&n.seconds>0))issues.push(n.name+' needs a positive time.');\n  if(incoming!==(n.type==='source'?0:1)||outgoing!==(n.type==='sink'?0:1))issues.push('Check the connections at '+n.name+'.');\n }\n if(m.edges.some(([a,b])=>!ids.has(a)||!ids.has(b)))issues.push('A connection has a missing endpoint.');\n const order=[],seen=new Set();let current=source[0];\n while(current&&!seen.has(current.id)){seen.add(current.id);order.push(current);const e=m.edges.find(e=>e[0]===current.id);current=e&&nodes.find(n=>n.id===e[1]);}\n if(current)issues.push('Remove the circular route.');\n if(seen.size!==nodes.length)issues.push('Connect every station to the source route.');\n return {issues,order};\n}\nexport function simulate(m,horizon=3600){\n const {issues,order}=inspect(m);if(issues.length)throw Error(issues.join(' '));\n const interval=order[0].seconds,stations=order.filter(n=>['processor','inspection'].includes(n.type)),count=Math.ceil(horizon/interval);\n if(count*Math.max(stations.length,1)>1000000)throw Error('Increase the arrival interval or shorten the run.');\n let completed=0,flow=0;const available=stations.map(()=>0);\n for(let i=0;i\u003ccount;i++){const arrival=i*interval;let at=arrival;\n  stations.forEach((n,j)=>{at=Math.max(at,available[j])+n.seconds;available[j]=at;});\n  if(at\u003c=horizon){completed++;flow+=at-arrival;}\n }\n return {completed,arrivals:count,averageFlow:completed?flow/completed:null,horizon};\n}\n\n","engine.mjs":"// Authoritative discrete-event engine for Flowstate.\n// Event priority is: releases/resumes, transfers/completions, then arrivals.\nconst VERSION = 'flowstate-des-2.7';\n\nfunction randomStream(seed) {\n  let value = seed >>> 0;\n  return () => {\n    value = (value + 0x6D2B79F5) >>> 0;\n    let x = Math.imul(value ^ (value >>> 15), value | 1);\n    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);\n    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;\n  };\n}\nfunction hashText(value) {\n  let h = 2166136261;\n  for (const char of String(value)) { h ^= char.charCodeAt(0); h = Math.imul(h, 16777619); }\n  return h >>> 0;\n}\nfunction sample(mean, distribution, random) {\n  if (distribution === 'exponential') return Math.max(1e-8, -Math.log1p(-random()) * mean);\n  if (distribution === 'uniform') return mean * (0.75 + 0.5 * random());\n  return mean;\n}\nclass EventHeap {\n  constructor() { this.items = []; this.serial = 0; }\n  before(a, b) { return a.time \u003c b.time || (a.time === b.time && (a.rank \u003c b.rank || (a.rank === b.rank && a.serial \u003c b.serial))); }\n  push(item) {\n    item.serial = this.serial++;\n    const heap = this.items;\n    let i = heap.length;\n    heap.push(item);\n    while (i) {\n      const parent = (i - 1) >> 1;\n      if (!this.before(item, heap[parent])) break;\n      heap[i] = heap[parent]; i = parent;\n    }\n    heap[i] = item;\n  }\n  pop() {\n    const heap = this.items, first = heap[0], last = heap.pop();\n    if (heap.length) {\n      let i = 0;\n      while (i * 2 + 1 \u003c heap.length) {\n        let child = i * 2 + 1;\n        if (child + 1 \u003c heap.length && this.before(heap[child + 1], heap[child])) child++;\n        if (!this.before(heap[child], last)) break;\n        heap[i] = heap[child]; i = child;\n      }\n      heap[i] = last;\n    }\n    return first;\n  }\n}\nfunction normalizeConfig(input = {}) {\n  const c = { horizon: 3600, warmup: 0, seed: 42, reps: 1, ...input };\n  if (!Number.isFinite(c.horizon) || c.horizon \u003c= 0 || c.hori 'Setting above threshold',low:'Setting below threshold',wait:'Pre-service wait exceeds seconds',restart:'Within seconds after a station restart',lot:'First N starts from each material lot'};\nconst fmt=v=>Number(v).toLocaleString(undefined,{maximumFractionDigits:1});\n\nexport function insertStation(model,node,from,to){\n  const edge=model.edges.findIndex(e=>e[0]===from&&e[1]===to);\n  if(edge\u003c0)throw Error('Select an existing connection.');\n  model.nodes.push(node);\n  model.edges.splice(edge,1,[from,node.id],[node.id,to]);\n  const source=model.nodes.find(n=>n.type==='source').id;\n  for(const p of model.products||[]){\n    if(!p.route?.length)continue;\n    const i=p.route.findIndex((s,i)=>s===to&&(i?p.route[i-1]:source)===from);\n    if(i>=0)p.route.splice(i,0,node.id);\n  }\n}\nfunction installGate(m){\n  const sink=m.nodes.find(n=>n.type==='sink');\n  if(!sink)throw Error('Connect the line to a sink before adding a quality rule.');\n  const id=()=>crypto.randomUUID(),gate=id(),repair=id();\n  for(const edge of m.edges)if(edge[1]===sink.id)edge[1]=gate;\n  m.edges.push([gate,sink.id],[gate,repair],[repair,sink.id]);\n  for(const p of m.products||[])if(p.route?.length)p.route.splice(-1,0,gate);\n  m.nodes.push({id:gate,name:'Quality inspection',fixture:'vision',type:'inspection',seconds:15,x:sink.x,y:sink.y+125},\n    {id:repair,name:'Rework bench',fixture:'repair',type:'processor',seconds:30,x:sink.x+215,y:sink.y+125});\n  m.quality={gate,repair,detection:85,recovery:90,modes:[]};\n}\n\nexport function openWorkplace({model,run,selected,modal,escape,apply,openExample,replay,baseline,tab='methods'}){\n const opt=(v,t)=>'\u003coption value=\"'+escape(v)+'\">'+escape(t)+'\u003c/option>';\n const pick=(id,label,items)=>'\u003clabel>'+label+'\u003cselect id=\"'+id+'\">'+items.map(([a,b])=>opt(a,b)).join('')+'\u003c/select>\u003c/label>';\n const num=(id,label,value,min,max,step='any')=>'\u003clabel>'+label+'\u003cinput required id=\"'+id+'\" type=\"number\" min !==model.quality?.repair);\n   if(!edges.length){screen('add','\u003cp>Use + Station and Connect in the 2D editor to create a connected line first.\u003c/p>');return;}\n   screen('add','\u003ch3>Insert a station into the line\u003c/h3>\u003cform id=\"wpAdd\">'+pick('wpEdge','Insert between',edges.map(([a,b],i)=>[i,station(a).name+' → '+station(b).name]))+pick('wpFixture','Equipment or method',Object.entries(fixtures).map(([k,v])=>[k,v[0]]))+'\u003clabel>Station name\u003cinput id=\"wpName\" required maxlength=\"60\">\u003c/label>\u003cdiv class=\"grid2\">'+num('wpSeconds','Seconds per job',30,.001,604800)+num('wpCapacity','Parallel jobs',1,1,64,1)+'\u003c/div>\u003clabel class=\"checkline\">\u003cinput id=\"wpAuto\" type=\"checkbox\"> Runs unattended during this step\u003c/label>'+\n   (model.crew?.roster?pick('wpWorker','Worker to train for a staffed station',model.crew.roster.map((w,i)=>[i,'W'+(i+1)+' · '+w.role])):'')+footer);\n   const preset=()=>{const v=fixtures[$('wpFixture').value];$('wpName').value=v[0];$('wpSeconds').value=v[1];$('wpAuto').checked=v[2];};\n   $('wpFixture').onchange=preset;preset();\n   submit('wpAdd',m=>{\n     const [from,to]=edges[+$('wpEdge').value],a=station(from),b=station(to);\n     const n={id:crypto.randomUUID(),fixture:$('wpFixture').value,name:$('wpName').value.trim(),type:'processor',seconds:$('wpSeconds').valueAsNumber,servers:$('wpCapacity').valueAsNumber,unattended:$('wpAuto').checked,x:(a.x+b.x)/2,y:(a.y+b.y)/2+100};\n     insertStation(m,n,from,to);if(m.crew?.roster&&!n.unattended)m.crew.roster[+$('wpWorker').value].stations.push(n.id);\n   });\n }\n function condition(){\n   const available=ids().filter(n=>n.type==='processor'&&n.id!==model.quality?.repair);\n   if(!available.length){screen('condition','\u003cp>Add a processing station first.\u003c/p>');return;}\n   const modes=model.quality?.modes||[];\n   screen('condition','\u003ch3>Condition-dependent defects\u003c/h3>\u003cform id=\"wpCondition\">'+pick('wpRule','Fault to model',[...modes.map((m,i)=>[i,m.name]),['new','Add a new fault']])+pick('wpSource','Fault originates at',available.map(n=>[n.id,n.name]))+'\u003clabel>Observable defect\u003cinput id=\"wpFault\" required maxlength=\"80\">\u003c/label>'+\n     pick('wpTrigger','Operating condition',[['none','Constant rate'],...Object.entries(triggers)])+'\u003cdiv class=\"grid2\">'+num('wpSetting','Current station setting',0,-100000,100000)+num('wpThreshold','Trigger threshold',0,-100000,100000)+'\u003c/div>\u003cdiv class=\"grid2\">'+num('wpRate','Normal defect chance (%)',3,0,100)+num('wpRisk','Chance while exposed (%)',30,0,100)+'\u003c/div>\u003cp id=\"wpHint\" class=\"muted\">\u003c/p>'+\n     (!model.quality?'\u003cp>Applying the first rule adds a final inspection and rework bench. Inspection catches 85% of faulty units and 90% of rework succeeds by default. Adjust these in Quality lab.\u003c/p>':'')+footer);\n   function hint(){\n     const type=$('wpTrigger').value;\n     $('wpSetting').disabled=!['high','low'].includes(type);$('wpThreshold').disabled=$('wpRisk').disabled=type==='none';\n     $('wpHint').textContent={high:'Use the same unit for the setting and threshold, such as °C.',low:'Both inputs use the same unit.',wait:'Wait is measured from joining this station to service start, including worker travel.',restart:'The interval starts when a repair or planned stop ends.',lot:'Requires material lots. Counts service starts from the same lot at this station.',none:'Each eligible unit uses the normal rate.'}[type];\n   }\n   function fill(){const old=modes[Number($('wpRule').value)],id=old?.station??(available.find(n=>n.id===selected)||available[0]).id;\n     $('wpSource').value=id;$('wpSetting').value=station(id).setting??0;$('wpFault').value=old?.name??'';$('wpRate').value=old?.rate??3;\n     $('wpTrigger').value=old?.condition?.type??'none';$('wpThreshold').value=old?.condition?.threshold??0;$('wpRisk').value=old?.condition?.rate??30;hint();}\n   $('wpRule').onchange=fill;$('wpSource').onchange=()=>{$('wpSetting').value=station($('wpSource').value).setting??0;};$('wpTrigger').onchange=hint;fill();\n   submit('wpCondition',m=>{\n     if(!m.quality){\n       installGate(m);\n       if(m.crew?.roster)m.crew.roster[0].stations.push(m.quality.gate,m.quality.repair);\n     }\n     const index=$('wpRule').value,mode=index==='new'?{id:'m-'+crypto.randomUUID()}:m.quality.modes[+index];\n     mode.name=$('wpFault').value.trim();mode.station=$('wpSource').value;mode.rate=$('wpRate').valueAsNumber;\n     const type=$('wpTrigger').value;if(type==='none')delete mode.condition;else mode.condition={type,threshold:$('wpThreshold').valueAsNumber,rate:$('wpRisk').valueAsNumber};\n     if(['high','low'].includes(type))m.nodes.find(n=>n.id===mode.station).setting=$('wpSetting').valueAsNumber;\n     if(index==='new')m.quality.modes.push(mode);\n   });\n }\n function maintenance(){\n   if(!ids().length){screen('maintenance','\u003cp>Add a processing station first.\u003c/p>');return;}\n   screen('maintenance','\u003ch3>Equipment availability\u003c/h3>\u003cform id=\"wpReliability\">'+pick('wpMachine','Station',ids().map(n=>[n.id,n.name]))+'\u003clabel class=\"checkline\">\u003cinput type=\"checkbox\" id=\"wpEnabled\"> Simulate age-related breakdowns\u003c/label>\u003cdiv class=\"grid2\">'+num('wpLife','Characteristic online life (s)',3600,1,604800)+num('wpRepair','Repair duration (s)',120,1,604800)+num('wpAge','Preventive service age (s, 0 = off)',0,0,604800)+num('wpPm','Service duration (s)',60,0,604800)+'\u003c/div>\u003cp>Failure age varies by seed (Weibull shape 2). Each repair or preventive service resets equipment age. Age includes idle online time. An outage pauses all jobs at this station and work resumes afterward.\u003c/p>'+footer);\n   $('wpMachine').value=ids().find(n=>n.id===selected)?.id??ids().find(n=>n.reliability)?.id??ids()[0].id;\n   function fill(){const r=station($('wpMachine').value).reliability;$('wpEnabled').checked=!!r;$('wpLife').value=r?.life??3600;$('wpRepair').value=r?.repair??120;$('wpAge').value=r?.pmAge??0;$('wpPm').value=r?.pmTime??60;}\n   $('wpMachine').onchange=fill;fill();\n   submit('wpReliability',m=>{const n=m.nodes.find(n=>n.id===$('wpMachine').value);if(!$('wpEnabled').checked)delete n.reliability;else n.reliability={life:$('wpLife').valueAsNumber,repair:$('wpRepair').valueAsNumber,pmAge:$('wpAge').valueAsNumber,pmTime:$('wpPm').valueAsNumber};});\n }\n function results(){\n   if(!run){screen('results','\u003cp>Run the current revision to review conditions and stops.\u003c/p>');return;}\n   const stops=Object.entries(run.calendars??{}).flatMap(([id,list])=>list.filter(s=>s.end>run.config.warmup&&s.start\u003crun.config.horizon).map(s=>({...s,id}))).sort((a,b)=>a.start-b.start);\n   const rows=(run.quality?.counts||[]).map(c=>'\u003ctr>\u003cth>'+escape(c.name)+'\u003c/th>\u003ctd>'+c.exposedFaults+' / '+c.exposed+'\u003c/td>\u003ctd>'+(c.faults-c.exposedFaults)+' / '+(c.opportunities-c.exposed)+'\u003c/td>\u003c/tr>').join('');\n   const summary=workplaceSummary(run);\n   screen('results','\u003ch3>Shift results\u003c/h3>\u003cdiv class=\"datagrid\">\u003ctable>\u003ctr>\u003cth>Measure\u003c/th>'+(baseline?'\u003cth>Before\u003c/th>':'')+'\u003cth>Current\u003c/th>\u003c/tr>'+[['Units completed','completed'],['Fault occurrences','faults'],['Station downtime (min)','minutes']].map(([label,key])=>'\u003ctr>\u003cth>'+label+'\u003c/th>'+(baseline?'\u003ctd>'+fmt(baseline[key])+'\u003c/td>':'')+'\u003ctd>'+fmt(summary[key])+'\u003c/td>\u003c/tr>').join('')+'\u003c/table>\u003c/div>'+(rows?'\u003ch3>Faults / opportunities\u003c/h3>\u003cdiv class=\"datagrid\">\u003ctable>\u003ctr>\u003cth>Defect\u003c/th>\u003cth>Condition present\u003c/th>\u003cth>Condition absent\u003c/th>\u003c/tr>'+rows+'\u003c/table>\u003c/div>':'')+'\u003ch3>Equipment stops\u003c/h3>'+(stops.length?'\u003cp>'+stops.length+' stops overlap this observation window. Select a stop to replay it.\u003c/p>'+stops.slice(0,50).map((s,i)=>'\u003cbutton class=\"choice\" data-stop=\"'+i+'\">'+escape(station(s.id).name)+' · '+s.reason+'\u003cspan>'+fmt(s.start)+'–'+fmt(s.end)+' s\u003c/span>\u003c/button>').join(''):'\u003cp>No equipment stop in this observation window.\u003c/p>'));\n   document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{const s=stops[+b.dataset.stop];replay({time:Math.max(s.start,run.config.warmup),stationId:s.id,kind:s.reason});});\n }\n const views={methods:examples,add,condition,maintenance,results};views[tab]();\n}\nexport function workplaceSummary(r){return {completed:r.completed,faults:(r.quality?.counts??[]).reduce((a,v)=>a+v.faults,0),minutes:r.rows.reduce((a,v)=>a+r.config.horizon-r.config.warmup-v.available,0)/60};}\n\n","walking-lab.mjs":"import {workerPath,routeBetween,pathLength} from './engine.mjs';\n\nexport function walkingSummary(run){\n  let metres=0,seconds=0;\n  for(const worker of run.workers)for(const leg of worker.intervals){\n    if(leg.kind!=='Walking')continue;\n    const overlap=Math.max(0,Math.min(run.config.horizon,leg.end)-Math.max(run.config.warmup,leg.start));\n    seconds+=overlap;metres+=leg.distance*overlap/(leg.end-leg.start);\n  }\n  return {metres,seconds,completed:run.completed};\n}\n\nexport function openWalkingLab({model,run,baseline,modal,escape,apply,example,staff}){\n  const $=id=>document.getElementById(id),fmt=v=>v==null?'—':v.toLocaleString(undefined,{maximumFractionDigits:2});\n  const stations=model.nodes.filter(n=>['source','processor','inspection'].includes(n.type));\n  if(!model.crew||stations.length\u003c2){\n    modal('Walking routes','\u003cp>Measured walking needs a staffed line and two stations.\u003c/p>\u003cbutton id=\"walkStaff\">Set up workers\u003c/button> \u003cbutton id=\"walkExample\">Open packing aisle example\u003c/button>');\n    $('walkStaff').onclick=staff;$('walkExample').onclick=example;return;\n  }\n  const options=stations.map(n=>'\u003coption value=\"'+escape(n.id)+'\">'+escape(n.name)+'\u003c/option>').join('');\n  let comparison=run?'\u003cp class=\"muted\">Current shift: '+fmt(walkingSummary(run).metres)+' m walked by the crew · '+run.completed+' units completed.\u003c/p>':'\u003cp class=\"muted\">Run the current layout first to capture a before-and-after comparison.\u003c/p>';\n  if(baseline&&run){\n    const now=walkingSummary(run),rows=[['Completed units',baseline.completed,now.completed],['Crew walking (m)',baseline.metres,now.metres],['Crew walking (min)',baseline.seconds/60,now.seconds/60],['Walking per completed unit (m)',baseline.completed?baseline.metres/baseline.completed:null,now.completed?now.metres/now.completed:null]];\n    comparison='\u003ch3>Same shift, two layouts\u003c/h3>\u003cdiv class=\"datagrid\">\u003ctable>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>Before\u003c/th>\u003cth>After\u003c/th>\u003c/tr>'+rows.map(([l,b,a])=>'\u003ctr>\u003cth>'+l+'\u003c/th>\u003ctd>'+fmt(b)+'\u003c/td>\u003ctd>'+fmt(a)+'\u003c/td>\u003c/tr>').join('')+'\u003c/table>\u003c/div>\u003cp class=\"muted\">First replication, seed '+run.config.seed+'. Walking totals cover the observation window.\u003c/p>';\n  }\n  modal('Walking routes','\u003cform id=\"walkForm\">\u003cdiv class=\"grid2\">\u003clabel>From station\u003cselect id=\"walkFrom\">'+options+'\u003c/select>\u003c/label>\u003clabel>To station\u003cselect id=\"walkTo\">'+options+'\u003c/select>\u003c/label>\u003c/div>\u003cp>Trace the aisle by placing bends in walking order. Workers use the same route in reverse on the return trip.\u003c/p>\u003csvg id=\"walkMap\" viewBox=\"0 0 650 280\" role=\"img\" aria-label=\"Floor plan with station entrances and selected walking route\">\u003c/svg>\u003cdiv class=\"group\">\u003cbutton type=\"button\" id=\"walkStraight\">Straight path\u003c/button>\u003cbutton type=\"button\" id=\"walkUndo\">Remove last bend\u003c/button>\u003cbutton type=\"button\" id=\"walkDefault\">Use shared aisle\u003c/button>\u003c/div>\u003cdetails>\u003csummary>Enter a bend by coordinates\u003c/summary>\u003cdiv class=\"grid2\">\u003clabel>East (m from floor origin)\u003cinput id=\"walkX\" type=\"number\" step=\"any\">\u003c/label>\u003clabel>South (m from floor origin)\u003cinput id=\"walkY\" type=\"number\" step=\"any\">\u003c/label>\u003c/div>\u003cbutton type=\"button\" id=\"walkBend\">Add bend\u003c/button>\u003c/details>\u003clabel>Measured trip distance (m, optional)\u003cinput id=\"walkMetres\" type=\"number\" min=\"0.001\" max=\"100000\" step=\"any\" placeholder=\"Use the scaled path length\">\u003c/label>\u003cp class=\"muted\">An entered measurement sets the trip time. Clear it to calculate distance from the drawing.\u003c/p>\u003cp id=\"walkInfo\" role=\"status\">\u003c/p>\u003cp id=\"walkError\" role=\"alert\">\u003c/p>\u003cdiv class=\"group\">\u003cbutton class=\"primary\" id=\"walkSave\">Apply route and run\u003c/button>\u003cbutton id=\"walkCancel\" type=\"button\">Discard edits\u003c/button>\u003c/div>\u003c/form>'+comparison+'\u003cdiv class=\"group\">\u003cbutton id=\"walkExample\">Open packing aisle example\u003c/button>\u003c/div>');\n  const first=model.walkingRoutes?.[0];\n  $('walkFrom').value=first?.from??stations[0].id;$('walkTo').value=first?.to??stations[1].id;\n  let via=[],custom=false,dirty=false,projectPoint;\n  const scale=model.crew.scale;\n  const node=id=>stations.find(n=>n.id===id);\n  const start=()=>node($('walkFrom').value),finish=()=>node($('walkTo').value);\n  const door=n=>[n.x/36,n.y/30+1.16];\n  const defaultPath=()=>workerPath({...model,walkingRoutes:[]},start(),finish());\n  function points(){return custom?[door(start()),...via,door(finish())]:defaultPath();}\n  function refresh(){\n    const path=points(),svg=$('walkMap'),all=[...stations.map(door),...path,...defaultPath()];\n    const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),minX=Math.min(...xs),minY=Math.min(...ys);\n    const rangeX=Math.max(4,Math.max(...xs)-minX),rangeY=Math.max(4,Math.max(...ys)-minY);\n    const zoom=Math.min(484/rangeX,182/rangeY),left=(650-rangeX*zoom)/2,top=(280-rangeY*zoom)/2;\n    const px=x=>left+(x-minX)*zoom,py=y=>top+(y-minY)*zoom;\n    projectPoint=(x,y)=>[(x-left)/zoom+minX,(y-top)/zoom+minY];\n    svg.innerHTML='\u003cpolyline fill=\"none\" stroke=\"#20a695\" stroke-width=\"4\" stroke-linejoin=\"round\" points=\"'+path.map(([x,y])=>px(x)+','+py(y)).join(' ')+'\"/>'+path.slice(1,-1).map(([x,y])=>'\u003ccircle cx=\"'+px(x)+'\" cy=\"'+py(y)+'\" r=\"4\" fill=\"#f5ba69\"/>').join('')+stations.map(n=>{const [x,y]=door(n),selected=n===start()||n===finish();return '\u003ccircle cx=\"'+px(x)+'\" cy=\"'+py(y)+'\" r=\"'+(selected?6:4)+'\" fill=\"'+(selected?'#07635d':'#74879a')+'\"/>\u003ctext x=\"'+px(x)+'\" y=\"'+(py(y)-10)+'\" text-anchor=\"middle\">'+escape(n.name.slice(0,22))+'\u003c/text>';}).join('');\n    const geometric=pathLength(path)*scale,measured=$('walkMetres').valueAsNumber,length=Number.isFinite(measured)?measured:geometric;\n    $('walkInfo').textContent=(custom?'Custom route':'Shared aisle')+' · drawn '+fmt(geometric)+' m · simulated trip '+fmt(length)+' m in '+fmt(length/model.crew.speed)+' s.';\n    $('walkSave').disabled=!dirty;$('walkCancel').disabled=!dirty;$('walkFrom').disabled=$('walkTo').disabled=dirty;\n    $('walkUndo').disabled=!path.slice(1,-1).length;\n  }\n  function loadPair(){\n    const rule=routeBetween(model,start().id,finish().id);\n    custom=!!rule;via=rule?(rule.from===start().id?rule.via:rule.via.slice().reverse()).map(p=>p.slice()):[];\n    $('walkMetres').value=rule?.metres??'';$('walkError').textContent='';dirty=false;refresh();\n  }\n  function change(){dirty=true;$('walkError').textContent='';refresh();}\n  function trace(){if(!custom){via=defaultPath().slice(1,-1);custom=true;}}\n  function bend(point){\n    if(point.some(v=>!Number.isFinite(v)||Math.abs(v)>10000)||points().length>=34){$('walkError').textContent='Enter valid coordinates and use at most 32 bends.';return;}\n    trace();via.push(point);change();\n  }\n  for(const [a,b] of [['walkFrom','walkTo'],['walkTo','walkFrom']])$(a).onchange=()=>{\n    if($(a).value===$(b).value)$(b).value=stations.find(n=>n.id!==$(a).value).id;\n    loadPair();\n  };\n  $('walkMap').onclick=e=>{const matrix=$('walkMap').getScreenCTM();if(!matrix)return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse());bend(projectPoint(p.x,p.y));};\n  $('walkBend').onclick=()=>bend([$('walkX').valueAsNumber/scale,$('walkY').valueAsNumber/scale]);\n  $('walkUndo').onclick=()=>{trace();via.pop();change();};\n  $('walkStraight').onclick=()=>{custom=true;via=[];$('walkMetres').value='';change();};\n  $('walkDefault').onclick=()=>{custom=false;via=[];$('walkMetres').value='';change();};\n  $('walkMetres').oninput=()=>{trace();change();};\n  $('walkCancel').onclick=loadPair;$('walkExample').onclick=example;\n  $('walkForm').onsubmit=e=>{\n    e.preventDefault();if(!dirty)return;\n    const from=start().id,to=finish().id,old=routeBetween(model,from,to),routes=(model.walkingRoutes||[]).filter(r=>r!==old);\n    if(custom)routes.push({from,to,via,metres:$('walkMetres').value===''?null:$('walkMetres').valueAsNumber});\n    if(routes.length>250){$('walkError').textContent='This model already has 250 measured routes.';return;}\n    apply(routes,run?walkingSummary(run):null);\n  };\n  loadPair();\n}\n","factory.mjs":"import {workerPath,pathLength} from './engine.mjs';\nimport {createDaylightRenderer} from './daylight.mjs';\n// Orthographic industrial cutaway. World coordinates are [east, south, height].\nexport function createFactory(canvas, onSelect = () => {}, onWorker = () => {}) {\n  const ctx = canvas.getContext('2d');\n  let gpu=null;\n  try{gpu=createDaylightRenderer();}catch(error){console.warn('Using canvas factory renderer:',error.message);}\n  let focused=false,clock=0,follow=0;\n  const palette = { steel:'#aabbd0', dark:'#253246', teal:'#315662', tealLight:'#77adb4',\n    cream:'#e8eaf0', white:'#fbfcff', rubber:'#465856', amber:'#ffad30', orange:'#f26e23', ink:'#223c35' };\n  const camera = { angle:.43, elevation:.59, zoom:1 };\n  let layer='live',run=null;\n  let qualityTrace=null;\n  const signalsByStation=new Map();\n  const qualitySignals={\n    fault:{color:'#ffa738',label:'Fault introduced'},\n    detected:{color:'#ffad46',label:'Defect detected'},\n    repair:{color:'#75d6bd',label:'Repair'},\n    scrap:{color:'#d95047',label:'Scrapped carton'},\n    escape:{color:'#f27067',label:'Escaped defect'}\n  };\n  function stationSignal(id){\n    if(qualityTrace!==run?.qualityTrace){\n      signalsByStation.clear();qualityTrace=run?.qualityTrace;\n      for(const event of qualityTrace||[]){\n        if(!Object.hasOwn(qualitySignals,event.kind))continue;\n        if(!signalsByStation.has(event.stationId))signalsByStation.set(event.stationId,[]);\n        signalsByStation.get(event.stationId).push(event);\n      }\n    }\n    const events=signalsByStation.get(id);\n    if(!events)return null;\n    let lo=0,hi=events.length;\n    while(lo\u003chi){const mid=(lo+hi)>>1;if(events[mid].time\u003c=clock)lo=mid+1;else hi=mid;}\n    const event=events[lo-1];\n    return event&&clock-event.time\u003c9?qualitySignals[event.kind]:null;\n  }\n  let model, frame={}, selected, width=1, height=1, scale=1, centerX=0, centerZ=0, screenY=0;\n  let faces=[], labels=[], hitFaces=[], hitLabels=[], pointer=null, disposed=false;\n  let ca,sa,ce,se;\n  const vector=(x,z,h=0)=>[x,z,h];\n  function project([x,z,h]) {\n    const u=x-centerX,v=z-centerZ,depth=u*sa+v*ca;\n    return [width/2+(u*ca-v*sa)*scale,screenY+(depth*se-h*ce)*scale,depth*ce+h*se];\n  }\n  function shade(hex, factor) {\n    const n=parseInt(hex.slice(1),16);\n    return 'rgb('+[n>>16,(n>>8)&255,n&255].map(c=>Math.round(Math.min(255,c*factor))).join(',')+')';\n  }\n  function face(points,color,group,station,outline=false) {\n    const screen=points.map(project), depth=screen.reduce((d,p)=>d+p[2],0)/screen.length;\n    faces.push({world:points,screen,color,group,station,outline,depth});\n  }\n  function slab(x,z,b,w,l,h,color,group=3,station=null,rot=0,outline=true) {\n    const c=Math.cos(rot),s=Math.sin(rot);\n    const corners=[[-w/2,-l/2],[w/2,-l/2],[w/2,l/2],[-w/2,l/2]].map(([a,d])=>[x+a*c-d*s,z+a*s+d*c]);\n    const top=corners.map(([a,d])=>[a,d,b+h]), bottom=corners.map(([a,d])=>[a,d,b]);\n    if(group===3&&h>.28&&scale>8){\n      face(top.map(([a,d,y])=>[a+y*.28,d+y*.18,.124]),'rgba(11,25,41,.095)',2);\n    }\n    face(top,shade(color,1.08),group,station,outline);\n    for(let i=0;i\u003c4;i++){\n      const j=(i+1)%4,dx=corners[j][0]-corners[i][0],dz=corners[j][1]-corners[i][1],len=Math.hypot(dx,dz);\n      const nx=dz/len,nz=-dx/len;\n      if(nx*sa+nz*ca>0.0001)face([bottom[i],bottom[j],top[j],top[i]],shade(color,.78-.09*nx-.06*nz),group,station,outline);\n    }\n  }\n  function cylinder(x,z,b,r,h,color,station,segments=12) {\n    const circle=Array.from({length:segments},(_,i)=>[x+r*Math.cos(i*2*Math.PI/segments),z+r*Math.sin(i*2*Math.PI/segments)]);\n    const top=circle.map(([a,d])=>[a,d,b+h]); face(top,shade(color,1.06),3,station);\n    for(let i=0;i\u003csegments;i++){\n      const j=(i+1)%segments,ang=(i+.5)*2*Math.PI/segments, nx=Math.cos(ang),nz=Math.sin(ang);\n      if(nx*sa+nz*ca>0)face([[...circle[i],b],[...circle[j],b],top[j],top[i]],shade(color,.83-.12*nx-.09*nz),3,station);\n    }\n  }\n  function rod(a,b,r,color,station) {\n    const axis=b.map((v,i)=>v-a[i]),length=Math.hypot(...axis); if(!length)return;\n    const unit=axis.map(v=>v/length),planar=Math.hypot(unit[0],unit[1]);\n    const u=planar?[-unit[1]/planar,unit[0]/planar,0]:[1,0,0];\n    const v=[unit[1]*u[2]-unit[2]*u[1],unit[2]*u[0]-unit[0]*u[2],unit[0]*u[1]-unit[1]*u[0]];\n    const ring=at=>Array.from({length:8},(_,i)=>at.map((q,j)=>q+r*(u[j]*Math.cos(i*Math.PI/4)+v[j]*Math.sin(i*Math.PI/4))));\n    const ra=ring(a),rb=ring(b);\n    for(let i=0;i\u003c8;i++){const j=(i+1)%8;face([ra[i],ra[j],rb[j],rb[i]],shade(color,.90+.09*Math.cos(i*Math.PI/4)),3,station);}\n    face(rb,color,3,station);\n  }\n  function plane(x,z,w,l,h,color,group,station,angle=0) {\n    const c=Math.cos(angle),s=Math.sin(angle);\n    face([[-w/2,-l/2],[w/2,-l/2],[w/2,l/2],[-w/2,l/2]].map(([a,d])=>[x+a*c-d*s,z+a*s+d*c,h]),color,group,station);\n  }\n  function crate(x,z,h,size,station,color='#c9945c') {\n    slab(x,z,h,size,size*.80,size*.72,color,3,station);\n    slab(x,z,h+size*.72,size*.16,size*.80,.013,'#e9cba1',3,station,0,false);\n  }\n  function person(x,z,shirt,station) {\n    cylinder(x,z,.04,.16,.36,palette.dark,station,8);\n    cylinder(x,z,.38,.21,.42,shirt,station,8);\n    cylinder(x,z,.80,.14,.23,'#bb9379',station,10);\n  }\n  function belt(a,b) {\n    const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);\n    if(len\u003c4.1)return;\n    const ang=Math.atan2(dz,dx),ux=dx/len,uz=dz/len,px=-uz,pz=ux;\n    const from=1.51,to=len-1.51,span=to-from,m=(from+to)/2;\n    const at=(d,side=0)=>[a.x+ux*d+px*side,a.z+uz*d+pz*side];\n    const mid=at(m);\n    plane(...mid,span,.95,.025,'#394c45',1,null,ang);\n    slab(...mid,.53,span,.78,.22,palette.dark,2,null,ang);\n    slab(...mid,.75,span,.67,.06,'#78928a',2,null,ang,false);\n    for(const side of [-1,1]){const p=at(m,side*.43);slab(...p,.75,span,.065,.13,'#b0bdb3',2,null,ang);}\n    for(let d=from+.2;d\u003cto;d+=.33){const p=at(d);plane(...p,.035,.65,.816,'#adbbb0',2,null,ang);}\n    for(let d=from+.48;d\u003cto;d+=2.5){const p=at(d);slab(...p,.03,.15,.70,.50,palette.steel,2,null,ang);}\n    // Small chevrons on the belt identify the actual routing direction.\n    for(let d=from+.85;d\u003cto-.25;d+=2.2){face([[...at(d-.16,-.19),.823],[...at(d+.13),.823],[...at(d-.16,.19),.823],[...at(d-.05),.823]],'#e6ede2',2,null);}\n  }\n  function floor(loX,hiX,loZ,hiZ) {\n    const cx=(loX+hiX)/2,cz=(loZ+hiZ)/2;\n    // A soft elliptical contact shadow grounds the entire cutaway.\n    const footprint=[project([loX,loZ,-.66]),project([hiX,loZ,-.66]),project([hiX,hiZ,-.66]),project([loX,hiZ,-.66])];\n    ctx.save();ctx.shadowColor='rgba(35,55,58,.36)';ctx.shadowBlur=Math.min(22,scale*.54);ctx.shadowOffsetY=5;polygon(footprint);ctx.fillStyle='#8da4a5';ctx.fill();ctx.restore();\n    const glow=ctx.createRadialGradient(width*.52,height*.62,0,width*.52,height*.62,width*.53);\n    glow.addColorStop(0,'rgba(91,167,225,.22)');glow.addColorStop(1,'rgba(91,167,225,0)');\n    ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);\n    slab(cx,cz,-.60,hiX-loX+.14,hiZ-loZ+.14,.23,'#223745',0);\n    slab(cx,cz,-.38,hiX-loX+.08,hiZ-loZ+.08,.12,'#7b9194',0);\n    slab((loX+hiX)/2,(loZ+hiZ)/2,-.26,hiX-loX,hiZ-loZ,.25,'#bbc5c3',0,null,0,false);\n    for(let x=Math.ceil(loX/2)*2;x\u003chiX;x+=2)plane(x,(loZ+hiZ)/2,.016,hiZ-loZ,.002,'#8f9f9e',1);\n    for(let z=Math.ceil(loZ/2)*2;z\u003chiZ;z+=2)plane((loX+hiX)/2,z,hiX-loX,.016,.002,'#8f9f9e',1);\n    for(const z of [loZ+.28,hiZ-.28])plane((loX+hiX)/2,z,hiX-loX-.56,.06,.008,'#73887a',1);\n    for(const x of [loX+.28,hiX-.28])plane(x,(loZ+hiZ)/2,.06,hiZ-loZ-.56,.008,'#73887a',1);\n  }\n  // The roof and near walls are cut away to keep the process and its queues visible.\n  function hall(x0,x1,z0,z1,campus){\n    const span=x1-x0,cx=(x0+x1)/2,wall='#c5d1d0',beam='#455c65';\n    const bays=Math.max(2,Math.min(12,Math.round(span/3.6))),bay=span/bays;\n    if(ca>-.1){\n      slab(cx,z0,0,span,.20,1.32,wall,3);\n      slab(cx,z0,3.25,span,.22,.24,'#91a2a4',3);\n      for(let i=0;i\u003cbays;i++){\n        const x=x0+(i+.5)*bay;\n        slab(x,z0,1.32,bay-.12,.075,1.93,'#b4d6dc',3);\n        slab(x,z0+.055,2.36,bay,.055,.055,beam,3);\n        for(const d of [-.25,0,.25])slab(x+d*bay,z0+.07,1.34,.045,.06,1.88,'#8ba6ae',3);\n        // Directional bands of daylight cross the concrete under each clerestory.\n        face([[x-bay*.36,z0+.22,.009],[x+bay*.36,z0+.22,.009],[x+bay*.36+1.1,z0+2.9,.009],[x-bay*.36+1.1,z0+2.9,.009]],'rgba(255,248,214,.32)',1);\n        slab(x-bay/2,z0+.06,0,.17,.29,3.58,beam,3);\n
