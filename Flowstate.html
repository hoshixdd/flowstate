/* Flowstate studio pass */
header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 12px #2346350a}
.runstrip{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 16px;padding:11px 15px;border:1px solid #cbd8c8;border-radius:10px;background:#eef3e9}
.runstate{display:flex;align-items:center;gap:10px;min-width:190px}
.runstate i,.runstate i:after{display:block;width:8px;height:8px;border-radius:50%;background:#63954d;content:''}
.runstate i{box-shadow:0 0 0 4px #d9e8d2}
.runstate i.warn{background:#b68142;box-shadow:0 0 0 4px #f1e3c9}
.runstate i.done{background:#2d8162;box-shadow:0 0 0 4px #d0e8d8}
.runstate span{display:block;color:#607064;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.runstate strong{display:block;margin-top:2px;font-size:14px;color:#234536}
.runfacts{display:flex;align-items:center;justify-content:flex-end;gap:18px;color:#4d6656;font-size:12px;white-space:nowrap}
.runfacts span+span{padding-left:18px;border-left:1px solid #c8d6c6}
.modelmeta{display:flex;align-items:center;gap:14px;min-width:0}
.product-legend{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;color:#4d6656;font-size:11px}
.product-legend>span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.product-legend .swatch{flex:0 0 auto;margin:0;width:7px;height:7px}
.inspector-context{margin:-5px 0 13px;color:#607064;font-size:12px;line-height:1.45}
@media(max-width:860px){.runstrip{align-items:flex-start;flex-direction:column;gap:8px}.runfacts{justify-content:flex-start;gap:12px;white-space:normal;flex-wrap:wrap}.runfacts span+span{padding-left:12px}}
@media(max-width:720px){.runstrip{margin-bottom:12px}.runstate{min-width:0}.runfacts{font-size:11px;gap:8px}.runfacts span+span{padding-left:8px}.modelmeta{align-items:flex-start;flex-direction:column;gap:5px}.product-legend{max-width:100%}.canvasfoot{align-items:flex-start;padding-top:8px;padding-bottom:8px}}

<header><a class="brand" href="#studio" aria-label="Flowstate studio"><svg viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#164c43"/><path d="M7 25l9-16h6l-9 16zm11 0 7-12h5l-7 12z" fill="#d8fc81"/></svg>Flowstate</a><span class="headsep"></span><nav aria-label="Workspace"><button id="workspaceNav" class="nav active">Studio</button><button id="projects" class="nav">Projects</button><button id="products" class="nav">Products</button><button id="experiments" class="nav">Experiments</button></nav><span class="save" id="save" role="status"></span></header>
<main id="studio"><div class="breadcrumb">Workspace <b>/</b> Simulation studio</div><div class="titlebar"><div><h1 id="title"></h1><p id="category"></p></div><div class="actions"><button id="settings">Run setup</button><button id="run" class="primary">▶ &nbsp; Run simulation</button></div></div>
<section class="runstrip" aria-label="Run snapshot"><div class="runstate"><i id="runSignal"></i><div><span>Run snapshot</span><strong id="runState">Ready to model</strong></div></div><div class="runfacts" id="runFacts"><span>2D editor active</span><span>No simulation yet</span><span>Run when the model is connected</span></div></section>
<section class="workspace"><div class="modelpane"><div class="panelhead"><div class="switch" aria-label="Model view"><button id="view3d">3D floor</button><button id="view2d">2D editor</button></div><div><button id="undo" aria-label="Undo" title="Undo">↶</button><button id="redo" aria-label="Redo" title="Redo">↷</button><button id="link" aria-pressed="false">Connect</button><button id="add">＋ Station</button></div></div>
<div class="stage" id="stage"><canvas id="factory" tabindex="0" aria-label="3D process floor. Use station selector in inspector to select equipment."></canvas><div class="stagetitle"><i></i> <span id="stageStatus">Factory floor</span></div><button id="fit" class="fit">Reset view</button></div>

<div class="transport"><button id="play" aria-label="Play or pause replay">▶</button><strong id="clock">00:00</strong><input id="scrub" aria-label="Simulation time" type="range" min="0" max="3600" value="0" step="1"><select id="speed" aria-label="Playback speed"><option>1</option><option>10</option><option selected>60</option><option>240</option></select><span>×</span></div>
<div class="canvasfoot"><div class="modelmeta"><span><i></i> <span id="count"></span></span><div id="productLegend" class="product-legend" aria-label="Product flows"></div></div><button id="checks">Check model</button></div></div>
<aside><div class="panelhead"><h2>Station inspector</h2></div><div class="stationpick"><label for="stationPick">Selected station</label><select id="stationPick"></select></div><div id="inspect"></div></aside></section>
<section class="analysis"><div class="reporttitle"><h2>Run results</h2><div class="reportactions"><span id="windowNote"></span><button id="report">Export report</button></div></div><div class="metrics" id="metrics"></div><div id="details" class="resultpanel"></div></section>
<details class="ideal"><summary>Ideal line capacity</summary><div class="metrics" id="idealMetrics"></div></details>
<div role="status" id="notice" aria-live="polite"></div><dialog id="dialog"><div class="dialoghead"><h2 id="dialogtitle"></h2><button id="close" aria-label="Close">×</button></div><div id="dialogbody"></div></dialog></main><script type="module">const sources={"model.mjs":"export const kinds = {source:'Source',processor:'Processor',queue:'Queue',inspection:'Inspection',sink:'Sink'};\nexport const templates = {\n  lab:{title:'Assembly line',category:'IE classroom lab',names:['Arrivals','Preparation','Assembly','Packaging','Finished units'],times:[30,30,45,36,0]},\n  production:{title:'Choco Bomb production',category:'Small production',names:['Ingredients','Mixing','Shaping','Packing','Finished boxes'],times:[40,35,55,40,0]},\n  campus:{title:'Campus service queue',category:'Campus services',names:['Student arrivals','Check-in','Document review','Release','Students served'],times:[120,60,180,90,0]}\n};\nexport function template(key){\n const t=templates[key], positions=[[36,64],[307,64],[578,64],[578,226],[307,226]];\n return {version:1,title:t.title,category:t.category,nodes:t.names.map((name,i)=>({id:'n'+i,name,type:i===0?'source':i===4?'sink':'processor',seconds:t.times[i],x:positions[i][0],y:positions[i][1]})),edges:[['n0','n1'],['n1','n2'],['n2','n3'],['n3','n4']],products:[{id:'unit',name:'Unit',color:'#d8fc81',interval:t.times[0],distribution:'fixed',route:[]}]};\n}\nexport function inspect(m){\n const issues=[],nodes=m.nodes, ids=new Set(nodes.map(n=>n.id)), source=nodes.filter(n=>n.type==='source'), sink=nodes.filter(n=>n.type==='sink');\n if(source.length!==1)issues.push('Use exactly one source.');\n if(sink.length!==1)issues.push('Use exactly one sink.');\n for(const n of nodes){\n  const incoming=m.edges.filter(e=>e[1]===n.id).length,outgoing=m.edges.filter(e=>e[0]===n.id).length;\n  if(!n.name.trim())issues.push('Give each station a name.');\n  if(n.type!=='queue'&&n.type!=='sink'&&!(Number.isFinite(n.seconds)&&n.seconds>0))issues.push(n.name+' needs a positive time.');\n  if(incoming!==(n.type==='source'?0:1)||outgoing!==(n.type==='sink'?0:1))issues.push('Check the connections at '+n.name+'.');\n }\n if(m.edges.some(([a,b])=>!ids.has(a)||!ids.has(b)))issues.push('A connection has a missing endpoint.');\n const order=[],seen=new Set();let current=source[0];\n while(current&&!seen.has(current.id)){seen.add(current.id);order.push(current);const e=m.edges.find(e=>e[0]===current.id);current=e&&nodes.find(n=>n.id===e[1]);}\n if(current)issues.push('Remove the circular route.');\n if(seen.size!==nodes.length)issues.push('Connect every station to the source route.');\n return {issues,order};\n}\nexport function simulate(m,horizon=3600){\n const {issues,order}=inspect(m);if(issues.length)throw Error(issues.join(' '));\n const interval=order[0].seconds,stations=order.filter(n=>['processor','inspection'].includes(n.type)),count=Math.ceil(horizon/interval);\n if(count*Math.max(stations.length,1)>1000000)throw Error('Increase the arrival interval or shorten the run.');\n let completed=0,flow=0;const available=stations.map(()=>0);\n for(let i=0;i\u003ccount;i++){const arrival=i*interval;let at=arrival;\n  stations.forEach((n,j)=>{at=Math.max(at,available[j])+n.seconds;available[j]=at;});\n  if(at\u003c=horizon){completed++;flow+=at-arrival;}\n }\n return {completed,arrivals:count,averageFlow:completed?flow/completed:null,horizon};\n}\n","factory.mjs":"// Orthographic software renderer. World coordinates are [east, south, height].\nexport function createFactory(canvas, onSelect = () => {}) {\n  const ctx = canvas.getContext('2d');\n  const palette = { steel:'#a7b5b1', dark:'#314846', teal:'#447b70', tealLight:'#6da492',\n    cream:'#e4e8d9', white:'#f7f5e9', rubber:'#465856', amber:'#dda94c', orange:'#d98247', ink:'#223c35' };\n  const camera = { angle:.53, elevation:.50, zoom:1 };\n  let model, frame={}, selected, width=1, height=1, scale=1, centerX=0, centerZ=0, screenY=0;\n  let faces=[], labels=[], hitFaces=[], hitLabels=[], pointer=null, disposed=false;\n  let ca,sa,ce,se;\n  const vector=(x,z,h=0)=>[x,z,h];\n  function project([x,z,h]) {\n    const u=x-centerX,v=z-centerZ,depth=u*sa+v*ca;\n    return [width/2+(u*ca-v*sa)*scale,screenY+(depth*se-h*ce)*scale,depth*ce+h*se];\n  }\n  function shade(hex, factor) {\n    const n=parseInt(hex.slice(1),16);\n    return 'rgb('+[n>>16,(n>>8)&255,n&255].map(c=>Math.round(Math.min(255,c*factor))).join(',')+')';\n  }\n  function face(points,color,group,station,outline=false) {\n    const screen=points.map(project), depth=screen.reduce((d,p)=>d+p[2],0)/screen.length;\n    faces.push({screen,color,group,station,outline,depth});\n  }\n  function slab(x,z,b,w,l,h,color,group=3,station=null,rot=0,outline=true) {\n    const c=Math.cos(rot),s=Math.sin(rot);\n    const corners=[[-w/2,-l/2],[w/2,-l/2],[w/2,l/2],[-w/2,l/2]].map(([a,d])=>[x+a*c-d*s,z+a*s+d*c]);\n    const top=corners.map(([a,d])=>[a,d,b+h]), bottom=corners.map(([a,d])=>[a,d,b]);\n    face(top,shade(color,1.035),group,station,outline);\n    for(let i=0;i\u003c4;i++){\n      const j=(i+1)%4,dx=corners[j][0]-corners[i][0],dz=corners[j][1]-corners[i][1],len=Math.hypot(dx,dz);\n      const nx=dz/len,nz=-dx/len;\n      if(nx*sa+nz*ca>0.0001)face([bottom[i],bottom[j],top[j],top[i]],shade(color,.78-.09*nx-.06*nz),group,station,outline);\n    }\n  }\n  function cylinder(x,z,b,r,h,color,station,segments=12) {\n    const circle=Array.from({length:segments},(_,i)=>[x+r*Math.cos(i*2*Math.PI/segments),z+r*Math.sin(i*2*Math.PI/segments)]);\n    const top=circle.map(([a,d])=>[a,d,b+h]); face(top,shade(color,1.06),3,station);\n    for(let i=0;i\u003csegments;i++){\n      const j=(i+1)%segments,ang=(i+.5)*2*Math.PI/segments, nx=Math.cos(ang),nz=Math.sin(ang);\n      if(nx*sa+nz*ca>0)face([[...circle[i],b],[...circle[j],b],top[j],top[i]],shade(color,.83-.12*nx-.09*nz),3,station);\n    }\n  }\n  function rod(a,b,r,color,station) {\n    const axis=b.map((v,i)=>v-a[i]),length=Math.hypot(...axis); if(!length)return;\n    const unit=axis.map(v=>v/length),planar=Math.hypot(unit[0],unit[1]);\n    const u=planar?[-unit[1]/planar,unit[0]/planar,0]:[1,0,0];\n    const v=[unit[1]*u[2]-unit[2]*u[1],unit[2]*u[0]-unit[0]*u[2],unit[0]*u[1]-unit[1]*u[0]];\n    const ring=at=>Array.from({length:8},(_,i)=>at.map((q,j)=>q+r*(u[j]*Math.cos(i*Math.PI/4)+v[j]*Math.sin(i*Math.PI/4))));\n    const ra=ring(a),rb=ring(b);\n    for(let i=0;i\u003c8;i++){const j=(i+1)%8;face([ra[i],ra[j],rb[j],rb[i]],shade(color,.90+.09*Math.cos(i*Math.PI/4)),3,station);}\n    face(rb,color,3,station);\n  }\n  function plane(x,z,w,l,h,color,group,station,angle=0) {\n    const c=Math.cos(angle),s=Math.sin(angle);\n    face([[-w/2,-l/2],[w/2,-l/2],[w/2,l/2],[-w/2,l/2]].map(([a,d])=>[x+a*c-d*s,z+a*s+d*c,h]),color,group,station);\n  }\n  function crate(x,z,h,size,station,color='#c9945c') {\n    slab(x,z,h,size,size*.80,size*.72,color,3,station);\n    slab(x,z,h+size*.72,size*.16,size*.80,.013,'#e9cba1',3,station,0,false);\n  }\n  function person(x,z,shirt,station) {\n    cylinder(x,z,.04,.16,.36,palette.dark,station,8);\n    cylinder(x,z,.38,.21,.42,shirt,station,8);\n    cylinder(x,z,.80,.14,.23,'#bb9379',station,10);\n  }\n  function belt(a,b) {\n    const dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);\n    if(len\u003c4.1)return;\n    const ang=Math.atan2(dz,dx),ux=dx/len,uz=dz/len,px=-uz,pz=ux;\n    const from=1.51,to=len-1.51,span=to-from,m=(from+to)/2;\n    const at=(d,side=0)=>[a.x+ux*d+px*side,a.z+uz*d+pz*side];\n    const mid=at(m);\n    plane(...mid,span,.95,.025,'#394c45',1,null,ang);\n    slab(...mid,.53,span,.78,.22,palette.dark,2,null,ang);\n    slab(...mid,.75,span,.67,.06,'#78928a',2,null,ang,false);\n    for(const side of [-1,1]){const p=at(m,side*.43);slab(...p,.75,span,.065,.13,'#b0bdb3',2,null,ang);}\n    for(let d=from+.2;d\u003cto;d+=.33){const p=at(d);plane(...p,.035,.65,.816,'#adbbb0',2,null,ang);}\n    for(let d=from+.48;d\u003cto;d+=2.5){const p=at(d);slab(...p,.03,.15,.70,.50,palette.steel,2,null,ang);}\n    // Small chevrons on the belt identify the actual routing direction.\n    for(let d=from+.85;d\u003cto-.25;d+=2.2){face([[...at(d-.16,-.19),.823],[...at(d+.13),.823],[...at(d-.16,.19),.823],[...at(d-.05),.823]],'#e6ede2',2,null);}\n  }\n  function floor(loX,hiX,loZ,hiZ) {\n    slab((loX+hiX)/2,(loZ+hiZ)/2,-.26,hiX-loX,hiZ-loZ,.25,'#415751',0,null,0,false);\n    for(let x=Math.ceil(loX/2)*2;x\u003chiX;x+=2)plane(x,(loZ+hiZ)/2,.016,hiZ-loZ,.002,'#526760',1);\n    for(let z=Math.ceil(loZ/2)*2;z\u003chiZ;z+=2)plane((loX+hiX)/2,z,hiX-loX,.016,.002,'#526760',1);\n    for(const z of [loZ+.28,hiZ-.28])plane((loX+hiX)/2,z,hiX-loX-.56,.06,.008,'#73887a',1);\n    for(const x of [loX+.28,hiX-.28])plane(x,(loZ+hiZ)/2,.06,hiZ-loZ-.56,.008,'#73887a',1);\n  }\n  function station(n,state,index,campus) {\n    const {x,z,id,type}=n;\n    const s=(dx,dz,b,w,l,h,c,rot=0)=>slab(x+dx,z+dz,b,w,l,h,c,3,id,rot);\n    const cyl=(dx,dz,b,r,h,c)=>cylinder(x+dx,z+dz,b,r,h,c,id);\n    const line=(a,b,r,c)=>rod([x+a[0],z+a[1],a[2]],[x+b[0],z+b[1],b[2]],r,c,id);\n    const {steel,dark,teal,tealLight,cream,white,amber,orange}=palette;\n    const busy=Math.max(0,Number(state.busy)||0),waiting=Math.max(0,Number(state.waiting)||0),progress=Math.max(0,Math.min(1,Number(state.progress)||0));\n    plane(x+.17,z+.23,3.22,2.68,.012,'#30463f',1);\n    slab(x,z,.015,3.25,2.62,.10,'#6c8377',2,id);\n    if(id===selected){\n      for(const a of [-1,1])for(const d of [-1,1]){\n        plane(x+a*1.51,z+d*1.27,.50,.105,.123,'#d8d970',2,id);\n        plane(x+a*1.71,z+d*1.07,.105,.5,.123,'#d8d970',2,id);\n      }\n    }\n    if(campus){\n      if(type==='queue'){\n        for(const d of [-.65,.05,.75])for(const a of [-.8,.25]){\n          s(a,d,.20,.49,.41,.16,teal);s(a,d-.20,.30,.49,.07,.40,tealLight);s(a,d,.12,.10,.21,.17,steel);\n        }\n      }else if(type==='source'||type==='sink'){\n        for(const a of [-.85,.77]){s(a,0,.12,.27,.72,1.00,teal);s(a,.04,1.13,.32,.78,.11,cream);}\n        s(-.05,-.50,.12,2.05,.12,1.05,steel);s(0,-.50,1.18,2.14,.22,.20,type==='source'?tealLight:amber);\n      }else{\n        s(0,0,.13,2.18,1.13,.82,teal);s(0,.05,.95,2.40,1.23,.14,cream);\n        s(.30,-.22,1.09,.15,.15,.38,dark);s(.30,-.22,1.40,.81,.09,.50,dark);s(.30,-.16,1.48,.66,.035,.30,'#a7c8ab');\n        s(-.72,.12,1.09,.39,.32,.04,white);s(.82,-.82,.20,.55,.50,.18,tealLight);\n      }\n    }else if(type==='source'){\n      for(const d of [-.62,.62])s(0,d,.13,2.78,.20,.18,dark);\n      s(0,0,.31,2.80,1.54,.17,steel);\n      // Material bins form part of the loading equipment.\n      for(const a of [-.78,0,.78]){s(a,0,.48,.65,1.25,.51,tealLight);s(a,0,.97,.70,1.31,.09,teal);s(a,0,1.065,.52,1.08,.02,dark);}\n      s(-1.12,-.73,.48,.12,.12,.94,amber);s(-.74,-.73,1.36,.86,.12,.09,amber);\n    }else if(type==='sink'){\n      for(const a of [-1.12,1.12])for(const d of [-.55,.55])s(a,d,.13,.12,.12,1.74,teal);\n      for(const h of [.25,.96,1.78]){s(0,0,h,2.44,1.31,.12,steel);s(0,.655,h,2.44,.07,.14,amber);}\n      for(let i=0;i\u003cMath.min(6,state.completed||0);i++)crate(x+(i%3-1)*.64,z,i\u003c3?.38:1.09,.52,id);\n    }else if(type==='queue'){\n      s(0,0,.13,2.65,1.52,.17,steel);\n      for(const d of [-.7,.7]){s(0,d,.30,2.62,.09,.37,teal);s(0,d,.66,2.68,.10,.06,amber);}\n      for(let a=-1.1;a\u003c=1.1;a+=.28)s(a,0,.30,.06,1.18,.08,dark);\n    }else if(type==='inspection'||/pack|release|seal/i.test(n.name)||index%3===0){\n      s(0,0,.14,2.44,1.51,.64,teal);s(0,0,.78,2.59,1.61,.14,cream);\n      for(const a of [-.66,.66])s(a,-.30,.92,.15,.15,1.28,steel);\n      s(0,-.30,2.15,1.77,.53,.33,cream);s(.04,-.18,1.66,.49,.40,.48,dark);\n      s(.07,.04,1.59,.60,.19,.10,amber);s(-.87,.40,.91,.42,.32,.31,dark);\n      s(-.87,.40,1.22,.31,.21,.02,'#93bda4');for(const a of [-.68,-.42,-.16])s(a,.765,.33,.075,.02,.31,steel);\n    }else if(/assembl|shap|review/i.test(n.name)||index%3===2){\n      s(0,0,.14,2.70,1.61,.28,teal);s(0,0,.42,2.78,1.69,.15,cream);\n      cyl(-.42,0,.57,.43,.20,dark);cyl(-.42,0,.77,.31,.30,amber);\n      const shoulder=[-.42,0,1.08],elbow=[-.79,-.12,1.96],wrist=[.32+progress*.19,-.10,2.12-progress*.30],tip=[.68+progress*.19,.12,1.43-progress*.30];\n      line(shoulder,elbow,.20,orange);line(elbow,wrist,.14,amber);line(wrist,tip,.115,orange);\n      for(const pt of [shoulder,elbow,wrist])cyl(pt[0],pt[1],pt[2]-.10,.19,.20,dark);\n      line(tip,[tip[0],tip[1],tip[2]-.23],.085,dark);s(.80,.02,.58,.72,.60,.14,steel);\n    }else{\n      s(0,0,.14,2.51,1.57,.67,teal);s(0,0,.81,2.64,1.68,.12,steel);\n      s(-.65,-.04,.94,.70,1.26,.81,cream);s(.72,-.04,.94,.37,1.26,.62,tealLight);\n      line([-.38,-.22,1.34],[.63,-.22,1.34],.19,steel);line([-.38,.22,1.34],[.63,.22,1.34],.19,dark);\n      s(-.64,.61,1.16,.43,.05,.31,dark);s(-.64,.65,1.22,.30,.025,.16,'#a8c6a3');\n      for(const a of [-.52,-.31,-.10,.11])s(a,.80,.38,.09,.035,.22,dark);\n    }\n    if(!['source','sink','queue'].includes(type)){\n      const light=busy?'#88c858':'#bac6bc';\n      cyl(1.13,-.47,.55,.045,1.02,steel);cyl(1.13,-.47,1.57,.088,.23,light);\n      if(busy){if(campus)person(x-.32,z+.90,teal,id);else crate(x+.62,z+.47,.93,.43,id);}\n      for(let i=1;i\u003cMath.min(busy,5);i++){const bx=x-1.55+(i-1)*.53;if(campus)person(bx,z+1.05,teal,id);else crate(bx,z+1.07,.13,.38,id);}\n    }\n    for(let i=0;i\u003cMath.min(waiting,8);i++){\n      const a=x-1.19+(i%4)*.60,d=z+(type==='queue'&&!campus?-.29:1.52)+Math.floor(i/4)*.49;\n      if(campus)person(a,d,i%2?teal:'#7998aa',id);else crate(a,d,type==='queue'?.39:.02,.43,id);\n    }\n    labels.push({n,p:project(vector(x,z,0)),state,active:id===selected});\n  }\n  function polygon(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();}\n  function draw(){\n    if(disposed||!model)return;\n    const rect=canvas.getBoundingClientRect();width=rect.width;height=rect.height;\n    if(width\u003c2||height\u003c2)return;\n    const dpr=Math.min(2,window.devicePixel
