/* Flowstate studio pass */
header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 12px #2346350a}
.runstrip{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 16px;padding:11px 15px;border:1px solid #cbd8c8;border-radius:10px;background:#eef3e9}
.runstate{display:flex;align-items:center;gap:10px;min-width:190px}
.runstate i,.runstate i:after{display:block;width:8px;height:8px;border-radius:50%;background:#63954d;content:''}
.runstate i{box-shadow:0 0 0 4px #d9e8d2}
.runstate i.warn{background:#b68142;box-shadow:0 0 0 4px #f1e3c9}
.runstate i.done{background:#2d8162;box-shadow:0 0 0 4px #d0e8d8}
.runstate span{display:block;color:#607064;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.runstate strong{display:block;margin-top:2px;font-size:14px;color:#234536}
.runfacts{display:flex;align-items:center;justify-content:flex-end;gap:18px;color:#4d6656;font-size:12px;white-space:nowrap}
.runfacts span+span{padding-left:18px;border-left:1px solid #c8d6c6}
.modelmeta{display:flex;align-items:center;gap:14px;min-width:0}
.product-legend{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden;color:#4d6656;font-size:11px}
.product-legend>span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.product-legend .swatch{flex:0 0 auto;margin:0;width:7px;height:7px}
.inspector-context{margin:-5px 0 13px;color:#607064;font-size:12px;line-height:1.45}
@media(max-width:860px){.runstrip{align-items:flex-start;flex-direction:column;gap:8px}.runfacts{justify-content:flex-start;gap:12px;white-space:normal;flex-wrap:wrap}.runfacts span+span{padding-left:12px}}
@media(max-width:720px){.runstrip{margin-bottom:12px}.runstate{min-width:0}.runfacts{font-size:11px;gap:8px}.runfacts span+span{padding-left:8px}.modelmeta{align-items:flex-start;flex-direction:column;gap:5px}.product-legend{max-width:100%}.canvasfoot{align-items:flex-start;padding-top:8px;padding-bottom:8px}}
dialog:has(#ws-lab){width:min(1050px,96vw);max-width:96vw}
#ws-lab .ws-tools,#ws-lab .ws-fields{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:14px 0}
#ws-lab label{display:grid;gap:4px;min-width:150px;flex:1}
#ws-lab input,#ws-lab select{width:100%;min-width:7em;box-sizing:border-box}
#ws-lab .ws-scroll{overflow:auto;margin:12px 0}#ws-lab th{text-align:left}
#ws-lab td,#ws-lab th{padding:5px}#ws-output{padding:14px 0}

#dialog:has(#walkForm){width:min(740px,94vw)}#walkMap{display:block;width:100%;height:auto;background:#edf4f5;border:1px solid #c4d6dc;border-radius:8px;cursor:crosshair}#walkMap text{font:600 12px system-ui;fill:#29444b;paint-order:stroke;stroke:#edf4f5;stroke-width:3px}#walkForm details{margin:12px 0}#walkForm summary{cursor:pointer;margin-bottom:8px}#walkError{color:#904029}

#dialog:has(#matForm),#dialog:has(#matGenealogy){width:min(810px,94vw)}#matTable input{min-width:85px}#matGenealogy{margin:12px 0}#matError{color:#924324}#supplyDeck{background:#214645}#supplyDeck small{color:#bce6cc}

#dialogbody form[id^="wp"] .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px 16px}
#dialogbody form[id^="wp"] .checkline{display:flex;align-items:center;gap:10px;margin-block:14px}
#dialogbody .checkline input[type="checkbox"]{width:auto;margin:0}
#wpError:not(:empty){border-left:3px solid #a74631;padding:8px 12px;color:#7a3021}
#dialogbody [data-wtab][aria-pressed="true"]{background:#164c43;color:white}


.event-summary, .event-nav, .event-pagination { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.event-summary { padding: 12px 17px; border-top: 1px solid #dae2e8; font-size: 14px; }
.transport button.review-events { width: auto; height: auto; white-space: nowrap; padding: 6px 10px; color: #174c62; border-color: #a6bdc8; font-size: 13px; }
.event-review { color: #192f40; }
.event-context { margin: 3px 0 16px; color: #496071; font-size: 14px; }
.event-filters { display: grid; grid-template-columns: 1.4fr 1.2fr 1fr; gap: 10px; }
.event-filters label { min-width: 0; font-size: 14px; color: #385466; }
.event-filters :is(input,select) { min-height: 40px; width: 100%; margin-top: 5px; font-size: 14px; }
.event-nav { padding: 9px 0; font-size: 14px; border-bottom: 1px solid #bfcfd8; }
.event-rows { padding: 0; margin: 0; list-style: none; max-height: min(46dvh, 450px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.event-rows li + li { border-top: 1px solid #e0e8ed; }
.event-rows button { width: 100%; border: 0; border-radius: 0; padding: 9px 6px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; text-align: left; color: #233f50; }
.event-rows button:hover, .event-rows button:focus-visible { background: #ebf4f5; }
.event-rows button:focus-visible { outline: 2px solid #176a79; outline-offset: -2px; }
.event-time { font: 13px ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
.event-rows strong, .event-rows small { display: block; overflow-wrap: anywhere; }
.event-rows strong { font-size: 15px; }
.event-rows small { margin-top: 3px; font-size: 13px; font-weight: 400; color: #4d6573; letter-spacing: 0; text-transform: none; }
.event-action { font-size: 13px; color: #116377; }
.event-pagination { padding-top: 10px; border-top: 1px solid #bfcfd8; font-size: 13px; }
@media (max-width: 550px) {
  .event-filters { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px 10px; }
  .event-filters label:last-child { grid-column: 1/-1; }
  .event-filters :is(input,select) { font-size: 16px; }
  .event-rows button { gap: 8px; }
}

<div role="status" id="notice" aria-live="polite"></div><dialog id="dialog"><div class="dialoghead"><h2 id="dialogtitle"></h2><button id="close" aria-label="Close">×</button></div><div id="dialogbody"></div></dialog></main><script type="module">const sources={"event-review.mjs":"const pageSize = 20;\nconst previousFilters = new WeakMap();\n\nfunction eventName(type) {\n  return type.charAt(0).toUpperCase() + type.slice(1).replaceAll('-', ' ');\n}\n\nexport function openEventReview({ run, model, modal, replay, timeLabel }) {\n  const all = run.eventLog;\n  const filters = previousFilters.get(run) ?? { station: '', kind: '', job: '', page: 0 };\n  previousFilters.set(run, filters);\n  const stations = new Map(model.nodes.map(node => [node.id, node.name]));\n  const products = new Map(run.productMetrics.map(product => [product.id, product.name]));\n  modal('Event review', `\u003csection class=\"event-review\">\n    \u003cp class=\"event-context\">\u003c/p>\n    \u003cdiv class=\"event-filters\">\n      \u003clabel>Station\u003cselect name=\"station\">\u003coption value=\"\">All stations\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel>Event\u003cselect name=\"kind\">\u003coption value=\"\">All events\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel>Job number\u003cinput type=\"search\" name=\"job\" inputmode=\"numeric\" placeholder=\"Any job\" autocomplete=\"off\">\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"event-nav\">\u003cspan class=\"event-count\" role=\"status\">\u003c/span>\u003cbutton type=\"button\" data-clear>Clear filters\u003c/button>\u003c/div>\n    \u003col class=\"event-rows\" aria-label=\"Recorded events\">\u003c/ol>\n    \u003cdiv class=\"event-pagination\">\u003cbutton data-prev>Previous\u003c/button>\u003cspan>\u003c/span>\u003cbutton data-next>Next\u003c/button>\u003c/div>\n  \u003c/section>`);\n  const panel = document.querySelector('#dialogbody .event-review');\n  const find = selector => panel.querySelector(selector);\n  const list = find('.event-rows');\n  find('.event-context').textContent = 'Seed ' + run.config.seed + ' · Full shift, including warm-up' +\n    (run.eventLogTruncated ? ' · Recording limit reached (' + all.length.toLocaleString() + ' events)' : '');\n  const stationInput = find('[name=\"station\"]');\n  const kindInput = find('[name=\"kind\"]');\n  const jobInput = find('[name=\"job\"]');\n  for (const [id, name] of stations) stationInput.add(new Option(name, id));\n  for (const kind of [...new Set(all.map(event => event.type))].sort()) {\n    kindInput.add(new Option(eventName(kind), kind));\n  }\n  function syncInputs() {\n    stationInput.value = filters.station;\n    kindInput.value = filters.kind;\n    jobInput.value = filters.job;\n  }\n  let matches = [];\n  function drawPage() {\n    const pages = Math.max(1, Math.ceil(matches.length / pageSize));\n    filters.page = Math.min(filters.page, pages - 1);\n    const start = filters.page * pageSize;\n    const visible = matches.slice(start, start + pageSize);\n    list.replaceChildren();\n    for (const event of visible) {\n      const item = document.createElement('li');\n      const action = document.createElement('button');\n      const stamp = document.createElement('span');\n      const detail = document.createElement('span');\n      const name = document.createElement('strong');\n      const context = document.createElement('small');\n      const verb = document.createElement('span');\n      stamp.className = 'event-time';\n      stamp.textContent = timeLabel(event.time);\n      stamp.title = event.time + ' s';\n      name.textContent = eventName(event.type);\n      context.textContent = [stations.get(event.stationId), products.get(event.productId),\n        event.jobId != null && 'Job ' + event.jobId].filter(Boolean).join(' · ');\n      detail.append(name, context);\n      verb.className = 'event-action';\n      verb.textContent = 'Replay';\n      action.append(stamp, detail, verb);\n      action.onclick = () => replay(event);\n      item.append(action);\n      list.append(item);\n    }\n    list.scrollTop = 0;\n    find('.event-count').textContent = matches.length\n      ? (start + 1).toLocaleString() + '–' + (start + visible.length).toLocaleString() + ' of ' + matches.length.toLocaleString() + ' events'\n      : 'No matching events';\n    find('[data-clear]').disabled = !(filters.station || filters.kind || filters.job);\n    find('[data-prev]').disabled = filters.page === 0;\n    find('[data-next]').disabled = filters.page + 1 >= pages;\n    find('.event-pagination span').textContent = 'Page ' + (filters.page + 1) + ' of ' + pages;\n    find('.event-pagination').hidden = !matches.length;\n  }\n  function filterEvents() {\n    const job = filters.job.trim();\n    matches = all.filter(event => (!filters.station || event.stationId === filters.station) &&\n      (!filters.kind || event.type === filters.kind) && (!job || (event.jobId != null && String(event.jobId) === job)));\n    drawPage();\n  }\n  panel.querySelector('.event-filters').oninput = () => {\n    Object.assign(filters, { station: stationInput.value, kind: kindInput.value, job: jobInput.value, page: 0 });\n    filterEvents();\n  };\n  find('[data-clear]').onclick = () => {\n    Object.assign(filters, { station: '', kind: '', job: '', page: 0 });\n    syncInputs();\n    filterEvents();\n    stationInput.focus();\n  };\n  find('[data-prev]').onclick = () => { filters.page--; drawPage(); };\n  find('[data-next]').onclick = () => { filters.page++; drawPage(); };\n  syncInputs();\n  filterEvents();\n}\n","daylight.mjs":"// Render the same triangulated scene used by the offline canvas fallback.\nexport function createDaylightRenderer(){\n  const surface=document.createElement('canvas');\n  const gl=surface.getContext('webgl2',{alpha:true,antialias:true,premultipliedAlpha:true});\n  if(!gl)return null;\n  function program(vertex,fragment){\n    const p=gl.createProgram();\n    for(const [type,src] of [[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]){\n      const shader=gl.createShader(type);gl.shaderSource(shader,'#version 300 es\\n'+src);gl.compileShader(shader);\n      if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));\n      gl.attachShader(p,shader);gl.deleteShader(shader);\n    }\n    gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;\n  }\n  const vertex=`precision highp float;\n    layout(location=0) in vec3 position; layout(location=1) in vec3 screen;\n    layout(location=2) in vec4 tint;\n    uniform vec2 viewport;uniform vec4 bounds;uniform float depthRange;uniform bool shadowPass;\n    out vec4 pigment;out vec3 world;out vec3 lightCoord;\n    void main(){\n      world=position; pigment=tint;\n      lightCoord=vec3((position.xy+position.z*vec2(.62,.39)-bounds.xy)/bounds.zw, .80-position.z*.09);\n      gl_Position=shadowPass?vec4(lightCoord*2.-1.,1.):vec4(screen.x/viewport.x*2.-1.,1.-screen.y/viewport.y*2.,-screen.z/depthRange,1.);\n    }`;\n  const fragment=`precision highp float;\n    in vec3 world;in vec4 pigment;in vec3 lightCoord;\n    uniform sampler2D shadows; uniform bool shadowPass; uniform vec3 eye;\n    out vec4 pixel;\n    void main(){\n      if(shadowPass){if(pigment.a\u003c.99)discard;pixel=vec4(1.);return;}\n      vec3 N=normalize(cross(dFdx(world),dFdy(world)));if(dot(N,eye)\u003c0.)N=-N;\n      vec3 L=normalize(vec3(-.62,-.39,1.)),H=normalize(L+eye);\n      float visibility=0.;\n      for(int y=-1;y\u003c=1;y++)for(int x=-1;x\u003c=1;x++){\n        float stored=texture(shadows,lightCoord.xy+vec2(x,y)/1024.).r;\n        visibility+=step(lightCoord.z-.004,stored)/9.;\n      }\n      vec3 c=pigment.rgb;\n      float grain=fract(sin(dot(floor(world.xy*32.),vec2(41.7,17.9)))*4375.2)-.5;\n      float gloss=1.-smoothstep(.05,.32,max(c.r,max(c.g,c.b))-min(c.r,min(c.g,c.b)));\n      float spec=pow(max(dot(N,H),0.),mix(8.,45.,gloss))*gloss*.21*visibility;\n      vec3 ambient=mix(vec3(.57,.65,.72),vec3(.86,.90,.93),clamp(N.z,0.,1.));\n      vec3 lit=c*(ambient+vec3(.34,.32,.26)*max(dot(N,L),0.)*visibility)+spec;\n      pixel=vec4(lit+grain*.021*(.3+.7*abs(N.z)),pigment.a);\n    }`;\n  const p=program(vertex,fragment),buffer=gl.createBuffer(),fb=gl.createFramebuffer(),shadow=gl.createTexture();\n  gl.bindTexture(gl.TEXTURE_2D,shadow);\n  gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,1024,1024,0,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);\n  for(const [key,value] of [[gl.TEXTURE_MIN_FILTER,gl.NEAREST],[gl.TEXTURE_MAG_FILTER,gl.NEAREST],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,key,value);\n  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,shadow,0);\n  gl.drawBuffers([gl.NONE]);gl.readBuffer(gl.NONE);\n  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)return null;\n  const u=Object.fromEntries(['viewport','bounds','depthRange','eye','shadowPass','shadows'].map(k=>[k,gl.getUniformLocation(p,k)]));\n  const colors=new Map();\n  function color(s){\n    if(colors.has(s))return colors.get(s);\n    let c=s.startsWith('#')?s.slice(1).match(/../g).map(x=>parseInt(x,16)):s.match(/[\\d.]+/g).map(Number);\n    const rgba=[c[0]/255,c[1]/255,c[2]/255,c[3]??1];colors.set(s,rgba);return rgba;\n  }\n  let vertices=new Float32Array(65536);\n  return function render(ctx,faces,{width,height,dpr,loX,hiX,loZ,hiZ,eye}){\n    if(gl.isContextLost())return false;\n    const w=Math.round(width*dpr),h=Math.round(height*dpr);\n    if(surface.width!==w||surface.height!==h){surface.width=w;surface.height=h;}\n    let offset=0;\n    for(const f of faces){\n      const rgba=color(f.color),needed=offset+30*(f.world.length-2);\n      if(needed>vertices.length){const next=new Float32Array(Math.max(needed,vertices.length*2));next.set(vertices);vertices=next;}\n      for(let i=1;i\u003cf.world.length-1;i++)for(const j of [0,i,i+1]){\n        vertices.set(f.world[j],offset);vertices.set(f.screen[j],offset+3);vertices.set(rgba,offset+6);offset+=10;\n      }\n    }\n    gl.useProgram(p);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,vertices.subarray(0,offset),gl.DYNAMIC_DRAW);\n    for(const [idx,n,start] of [[0,3,0],[1,3,12],[2,4,24]]){gl.enableVertexAttribArray(idx);gl.vertexAttribPointer(idx,n,gl.FLOAT,false,40,start);}\n    gl.uniform2f(u.viewport,width,height);gl.uniform4f(u.bounds,loX-6,loZ-6,hiX-loX+12,hiZ-loZ+12);gl.uniform1f(u.depthRange,hiX-loX+hiZ-loZ+30);gl.uniform3fv(u.eye,eye);\n    gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);\n    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,null);gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.viewport(0,0,1024,1024);gl.clear(gl.DEPTH_BUFFER_BIT);gl.uniform1i(u.shadowPass,1);gl.drawArrays(gl.TRIANGLES,0,offset/10);\n    gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);\n    gl.uniform1i(u.shadowPass,0);gl.bindTexture(gl.TEXTURE_2D,shadow);gl.uniform1i(u.shadows,0);gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.drawArrays(gl.TRIANGLES,0,offset/10);gl.disable(gl.BLEND);\n    ctx.drawImage(surface,0,0,width,height);return true;\n  };\n}\n","quality-lab.mjs":"const eventNames={fault:'Fault introduced',detected:'Diverted to rework',repair:'Repair completed',scrap:'Scrapped',escape:'Escaped inspection'};\nconst measures={faults:'Faults introduced',detected:'Units sent to rework',scrapped:'Units scrapped',escaped:'Faulty units shipped',goodShipped:'Good units shipped'};\nconst number=v=>Number(v).toLocaleString(undefined,{maximumFractionDigits:2});\nconst $=id=>document.getElementById(id);\nconst clock=t=>new Date(Math.floor(t)*1000).toISOString().slice(11,19)+(t>=86400?' +'+Math.floor(t/86400)+'d':'');\nexport function openQualityLab(ctx){\n const {model,run,modal,escape,apply,seek,trial,saveTrial,previous,download}=ctx,q=model.quality;\n const station=id=>escape(model.nodes.find(n=>n.id===id)?.name||id);\n const names=ids=>ids.split(',').map(id=>q.modes.find(m=>m.id===id)?.name||id).join(', ');\n const panel=(tab,html)=>{\n   modal('Factory quality lab','\u003cnav class=\"quality-tabs\" aria-label=\"Quality study\">'+[['results','Shift review'],['field','Workplace data'],['trial','Test a change']].map(([id,title])=>'\u003cbutton data-qt=\"'+id+'\" aria-pressed=\"'+(tab===id)+'\">'+title+'\u003c/button>').join('')+'\u003c/nav>'+html);\n   document.querySelectorAll('[data-qt]').forEach(b=>b.onclick=()=>views[b.dataset.qt]());\n };\n function review(){\n   if(!run?.quality){panel('results','\u003cp>Run this revision to review its quality events.\u003c/p>');return;}\n   const s=run.quality,ranked=s.counts.slice().sort((a,b)=>b.faults-a.faults),total=ranked.reduce((n,r)=>n+r.faults,0);\n   const events=run.qualityTrace.filter(e=>e.time>=run.config.warmup),units=[...new Set(events.map(e=>e.jobId))];\n   panel('results','\u003ch3>First-pass quality\u003c/h3>\u003cp>\u003cb class=\"q-yield\">'+(s.inspected?number(100*s.firstGood/s.inspected)+'%':'—')+'\u003c/b> '+s.firstGood+' of '+s.inspected+' units arrived at the gate free of modeled faults.\u003c/p>\u003cdiv class=\"q-facts\">'+[['Sent to rework',s.detected],['Recovered',s.repaired],['Scrapped',s.scrapped],['Shipped faulty',s.escaped],['Shipped good',s.goodShipped]].map(([k,v])=>'\u003cdiv>\u003cb>'+v+'\u003c/b>\u003csmall>'+k+'\u003c/small>\u003c/div>').join('')+'\u003c/div>'+\n     '\u003ch3>Faults by source\u003c/h3>\u003cp>Ranked by occurrences during the observation window. A unit can have several faults.\u003c/p>\u003cdiv class=\"q-rank\">'+ranked.map(r=>'\u003cdiv>\u003cspan>'+escape(r.name)+' \u003csmall>'+station(r.station)+'\u003c/small>\u003c/span>\u003cprogress max=\"'+Math.max(1,ranked[0].faults)+'\" value=\"'+r.faults+'\">\u003c/progress>\u003cb>'+r.faults+'\u003c/b>\u003csmall>'+number(total?100*r.faults/total:0)+'%\u003c/small>\u003c/div>').join('')+'\u003c/div>'+\n     '\u003ch3>Trace a unit\u003c/h3>'+(units.length?'\u003clabel>Unit with a quality event\u003cselect id=\"qUnit\">'+units.map(id=>'\u003coption value=\"'+id+'\">Unit '+id+'\u003c/option>').join('')+'\u003c/select>\u003c/label>\u003cdiv id=\"qTrace\">\u003c/div>\u003cbutton id=\"qExport\">Export quality event CSV\u003c/button>':'\u003cp>No quality events in this observation window.\u003c/p>'));\n   if(!units.length)return;\n   function trace(){\n     const rows=run.qualityTrace.filter(e=>e.jobId===+$('qUnit').value);\n     const order=run.inventory?.orders[+$('qUnit').value-1];\n     $('qTrace').innerHTML=(order?.lot?'\u003cp>Supplier lot \u003cstrong>'+escape(order.lot)+'\u003c/strong> · issued at '+clock(order.issued)+'\u003c/p>':'')+rows.map((e,i)=>'\u003cdiv class=\"listitem\">\u003cdiv>\u003cstrong>'+eventNames[e.kind]+' · '+station(e.stationId)+'\u003c/strong>\u003csmall>'+escape(names(e.mode))+'\u003c/small>\u003c/div>\u003cbutton data-jump=\"'+i+'\">Replay '+clock(e.time)+'\u003c/button>\u003c/div>').join('');\n     document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>seek(rows[+b.dataset.jump]));\n   }\n   $('qUnit').onchange=trace;trace();\n   $('qExport').onclick=()=>{\n     const csvCell=v=>{let s=String(v);if(/^[=+@\\-\\t\\r]/.test(s))s=\"'\"+s;return '\"'+s.replaceAll('\"','\"\"')+'\"';};\n     const rows=[['Simulation seconds','Unit','Station','Event','Defect'],...events.map(e=>[e.time,e.jobId,model.nodes.find(n=>n.id===e.stationId)?.name,eventNames[e.kind],names(e.mode)])];\n     download('flowstate-quality-events.csv','\\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\\r\\n'),'text/csv');\n   };\n }\n function field(){\n   const saved=q.field||{};\n   const input=(id,val,min,max,step='1',required=true)=>'\u003cinput type=\"number\" id=\"'+id+'\" min=\"'+min+'\" max=\"'+max+'\" step=\"'+step+'\" '+(required?'required':'')+' value=\"'+escape(val??'')+'\">';\n   panel('field','\u003ch3>Calibrate a shift\u003c/h3>\u003cp>Count faults at their source. Enter the number of units checked there and how many showed that fault. For conditional faults, enter observations from periods when the condition was absent. Leave both counts empty to keep the stated probability.\u003c/p>\u003cform id=\"qField\">\u003cdiv class=\"datagrid\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Fault / station\u003c/th>\u003cth>Checked\u003c/th>\u003cth>Faulty\u003c/th>\u003cth>Model rate\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+q.modes.map((m,i)=>'\u003ctr>\u003cth>'+escape(m.name)+'\u003csmall>'+station(m.station)+'\u003c/small>\u003c/th>\u003ctd>'+input('qN'+i,saved[m.id]?.n,1,1e8,1,false)+'\u003c/td>\u003ctd>'+input('qD'+i,saved[m.id]?.d,0,1e8,1,false)+'\u003c/td>\u003ctd>'+number(m.rate)+'%\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"grid2\">\u003clabel>Faulty units caught at gate (%)'+input('qCatch',q.detection,0,100,'any')+'\u003c/label>\u003clabel>Reworked units recovered (%)'+input('qRecover',q.recovery,0,100,'any')+'\u003c/label>\u003c/div>\u003clabel>Shift or sample reference\u003cinput id=\"qRef\" maxlength=\"100\" value=\"'+escape(q.reference||'')+'\" placeholder=\"e.g. Line A, morning shift\">\u003c/label>\u003clabel>Good units shipped on a separate observed shift (optional)'+input('qActual',q.actual,0,1e8,1,false)+'\u003c/label>\u003cp class=\"muted\">Match the run duration, arrivals, staffing and starting inventory. This model starts empty. Compare a separate shift of the same length and exclude warm-up from both totals.\u003c/p>\u003cp id=\"qError\" role=\"alert\">\u003c/p>\u003cbutton class=\"primary\">Save workplace data and run\u003c/button>\u003c/form>'+\n    (q.actual!=null&&run?.quality?'\u003cp>\u003cb>Baseline check\u003c/b> · '+q.actual+' observed good units versus '+run.quality.goodShipped+' simulated in this run. Difference '+number(run.quality.goodShipped-q.actual)+' units.\u003c/p>':''));\n   const investigation=document.createElement('details');\n   investigation.innerHTML='\u003csummary>Define workplace defects and record a cause to investigate\u003c/summary>\u003cp>Describe an observable defect at each station. Record the evidence you would need to confirm a cause on the floor.\u003c/p>'+\n     q.modes.map((m,i)=>'\u003clabel>'+station(m.station)+' defect\u003cinput id=\"qName'+i+'\" maxlength=\"80\" required value=\"'+escape(m.name)+'\">\u003c/label>').join('')+\n     '\u003clabel>Suspected cause and supporting observation\u003ctextarea id=\"qCause\" maxlength=\"1500\" rows=\"2\" placeholder=\"e.g. Underfilled units clustered after hopper refills.\">'+escape(q.cause||'')+'\u003c/textarea>\u003c/label>'+\n     '\u003clabel>Countermeasure and verification plan\u003ctextarea id=\"qPlan\" maxlength=\"1500\" rows=\"2\" placeholder=\"e.g. Check the dose after each refill. Compare the next shift at the same volume.\">'+escape(q.plan||'')+'\u003c/textarea>\u003c/label>';\n   $('qField').prepend(investigation);\n   q.modes.forEach((m,i)=>{ $('qN'+i).setAttribute('aria-label',m.name+' units checked');$('qD'+i).setAttribute('aria-label',m.name+' faulty units'); });\n   $('qField').onsubmit=e=>{\n     e.preventDefault();const next=structuredClone(q);next.field={};next.reference=$('qRef').value.trim();next.actual=$('qActual').value===''?null:$('qActual').valueAsNumber;\n     next.cause=$('qCause').value.trim();next.plan=$('qPlan').value.trim();\n     for(const [i,m] of next.modes.entries()){\n       const name=$('qName'+i).value.trim();\n       if(!name){investigation.open=true;$('qError').textContent='Give every workplace defect an observable name.';return;}\n       m.name=name;\n       const n=$('qN'+i),d=$('qD'+i);\n       if(!n.value&&!d.value)continue;\n       if(!n.value||!d.value||d.valueAsNumber>n.valueAsNumber){$('qError').textContent='Enter both counts for '+m.name+' and keep faulty units at or below units checked.';return;}\n       next.field[m.id]={n:n.valueAsNumber,d:d.valueAsNumber};m.rate=100*d.valueAsNumber/n.valueAsNumber;\n     }\n     next.detection=$('qCatch').valueAsNumber;next.recovery=$('qRecover').valueAsNumber;apply(next);\n   };\n }\n function experiment(){\n   const choices=[...q.modes.map((m,i)=>({id:'mode'+i,label:m.name+' occurrence',value:m.rate,index:i})),{id:'detection',label:'Gate detection',value:q.detection},{id:'recovery',label:'Repair recovery',value:q.recovery}];\n   function table(report){\n     if(!report)return '';\n     return '\u003ch3>Matched shift results\u003c/h3>\u003cp>'+escape(report.label)+' · '+number(report.from)+'% → '+number(report.to)+'%. '+report.reps+' paired runs, starting seed '+report.seed+'. Values are units per observation window, except fault occurrences.\u003c/p>\u003cdiv class=\"datagrid\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>Current\u003c/th>\u003cth>Proposed\u003c/th>\u003cth>Mean change [95% interval]\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+Object.entries(measures).map(([key,title])=>{const row=report.metrics[key],d=row.delta;return '\u003ctr>\u003cth>'+title+'\u003c/th>\u003ctd>'+number(row.before)+'\u003c/td>\u003ctd>'+number(row.after)+'\u003c/td>\u003ctd>'+number(d.mean)+' ['+number(d.mean-d.margin)+', '+number(d.mean+d.margin)+']\u003c/td>\u003c/tr>';}).join('')+'\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">The interval describes simulation variability under these assumptions. Test the proposed change on the floor and measure a fresh sample.\u003c/p>';\n   }\n   panel('trial','\u003ch3>Test one process change\u003c/h3>\u003cp>Enter the rate you expect after a change, such as a filler adjustment. Each pair uses the same shift seed, demand, staffing and duration.\u003c/p>\u003cform id=\"qTrial\">\u003clabel>Change to test\u003cselect id=\"qChoice\">'+choices.map(c=>'\u003coption value=\"'+c.id+'\">'+escape(c.label)+'\u003c/option>').join('')+'\u003c/select>\u003c/label>\u003cdiv class=\"grid2\">\u003clabel>Proposed rate (%)\u003cinput id=\"qTo\" type=\"number\" step=\"any\" min=\"0\" max=\"100\" required>\u003c/label>\u003clabel>Paired shifts\u003cinput type=\"number\" id=\"qReps\" min=\"2\" max=\"30\" value=\"10\" required>\u003c/label>\u003c/div>\u003cp id=\"qBase\">\u003c/p>\u003cbutton class=\"primary\">Compare shifts\u003c/button>\u003c/form>\u003cdiv id=\"qOutcome\" aria-live=\"polite\">'+table(previous())+'\u003c/div>');\n   function candidate(c,to){\n     const proposed=structuredClone(model);\n     if(c.index!=null){\n       const mode=proposed.quality.modes[c.index];mode.rate=to;\n       if(proposed.quality.field)delete proposed.quality.field[mode.id];\n     }else proposed.quality[c.id]=to;\n     proposed.quality.actual=null;\n     return proposed;\n   }\n   function addActions(report,out){\n     const c=choices.find(choice=>choice.id===report?.parameter);\n     if(!c)return;\n     out.insertAdjacentHTML('beforeend','\u003cdiv class=\"group\">\u003cbutton id=\"qProposal\">Open proposed factory as a copy\u003c/button>\u003cbutton id=\"qCompareCSV\">Export comparison CSV\u003c/button>\u003c/div>');\n     $('qProposal').onclick=()=>ctx.openProposal(candidate(c,report.to));\n     $('qCompareCSV').onclick=()=>{\n       const rows=[['Measure','Current mean','Proposed mean','Mean change','Lower 95%','Upper 95%','Paired runs','First seed','Warm-up s','Horizon s','Parameter','Current %','Proposed %']];\n       for(const [key,label] of Object.entries(measures)){const r=report.metrics[key],d=r.delta;rows.push([label,r.before,r.after,d.mean,d.mean-d.margin,d.mean+d.margin,report.reps,report.seed,ctx.config.warmup,ctx.config.horizon,report.parameter,report.from,report.to]);}\n       download('flowstate-quality-comparison.csv',rows.map(r=>r.join(',')).join('\\r\\n'),'text/csv');\n     };\n   }\n   addActions(previous(),$('qOutcome'));\n   function select(){const c=choices[$('qChoice').selectedIndex];$('qBase').textContent='Current rate: '+number(c.value)+'%';$('qTo').value=c.value;}\n   $('qChoice').onchange=select;select();\n   $('qTrial').onsubmit=async e=>{\n     e.preventDefault();const c=choices[$('qChoice').selectedIndex],to=$('qTo').valueAsNumber,reps=$('qReps').valueAsNumber,proposed=candidate(c,to),out=$('qOutcome'),button=e.target.querySelector('button');\n     button.disabled=true;out.textContent='Comparing shifts…';\n     try{const metrics=await trial(proposed,reps);const report={metrics,parameter:c.id,from:c.value,to,label:c.label,reps,seed:ctx.config.seed};saveTrial(report);out.innerHTML=table(report);if(out.isConnected)addActions(report,out);}\n     catch(err){out.textContent=err.message;}finally{button.disabled=false;}\n   };\n }\n const views={results:review,field,trial:experiment};review();\n}\n\n","materials-lab.mjs":"const $=id=>document.getElementById(id);\nconst fmt=n=>n.toLocaleString(undefined,{maximumFractionDigits:2});\nconst lotTime=t=>fmt(t)+' s';\n\nexport function openMaterials({model,run,config,baseline,modal,escape,download,example,replay,apply}){\n  const inventory=run?.inventory;\n  const summary=r=>({completed:r.completed,shortage:r.inventory.shortageSeconds,waiting:r.inventory.waiting});\n  function panel(view,content){\n    modal('Materials and lots','\u003cnav class=\"quality-tabs\" aria-label=\"Material study\">\u003cbutton id=\"matReview\" aria-pressed=\"'+(view==='review')+'\">Lot review\u003c/button>\u003cbutton id=\"matSchedule\" aria-pressed=\"'+(view==='schedule')+'\">Delivery schedule\u003c/button>\u003c/nav>'+content+'\u003cdiv class=\"group\">\u003cbutton id=\"matExample\">Open carton supply example\u003c/button>\u003c/div>');\n    $('matReview').onclick=review;$('matSchedule').onclick=schedule;$('matExample').onclick=example;\n  }\n  function review(){\n    if(!inventory){\n      panel('review','\u003cp>'+ (model.supply?'Run this revision to review material use.':'Set a delivery schedule to track material on this line, or open the carton supply example.')+'\u003c/p>');return;\n    }\n    const inv=inventory,r=run,clock=r.config;\n    const rows=inv.lots.map((l,i)=>'\u003ctr>\u003cth>'+escape(l.id)+'\u003c/th>\u003ctd>'+lotTime(l.at)+'\u003c/td>\u003ctd>'+l.received+'\u003c/td>\u003ctd>'+l.used+'\u003c/td>\u003ctd>'+(l.received-l.used)+'\u003c/td>\u003ctd>'+l.good+'\u003c/td>\u003ctd>'+l.escaped+'\u003c/td>\u003ctd>'+l.scrapped+'\u003c/td>\u003ctd>'+l.rejected+'\u003c/td>\u003ctd>'+(l.used-l.good-l.escaped-l.scrapped-l.rejected)+'\u003c/td>\u003c/tr>').join('');\n    let comparison='';\n    if(baseline){\n      const now=summary(r);\n      comparison='\u003ch3>Same shift, two delivery schedules\u003c/h3>\u003cdiv class=\"datagrid\">\u003ctable>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>Before\u003c/th>\u003cth>After\u003c/th>\u003c/tr>'+[['Completed units','completed'],['Shortage (s)','shortage'],['Orders still waiting','waiting']].map(([l,k])=>'\u003ctr>\u003cth>'+l+'\u003c/th>\u003ctd>'+fmt(baseline[k])+'\u003c/td>\u003ctd>'+fmt(now[k])+'\u003c/td>\u003c/tr>').join('')+'\u003c/table>\u003c/div>';\n    }\n    const startState=inv.trace.findLast(s=>s.time\u003c=clock.warmup);\n    const firstWait=startState?.waiting>0?{time:clock.warmup}:inv.trace.find(s=>s.waiting>0&&s.time>=clock.warmup);\n    panel('review','\u003ch3>'+escape(inv.name)+' at receiving\u003c/h3>\u003cdiv class=\"q-facts\">'+[['In stock at end',inv.onHand],['Orders awaiting material',inv.waiting],['Peak orders waiting',inv.peakWaiting],['Shortage minutes',fmt(inv.shortageSeconds/60)]].map(([l,v])=>'\u003cdiv>\u003cb>'+v+'\u003c/b>\u003csmall>'+l+'\u003c/small>\u003c/div>').join('')+'\u003c/div>\u003cp>Shortage time counts periods with at least one unfilled material request during seconds '+fmt(clock.warmup)+'–'+fmt(clock.horizon)+'. Total waiting across orders: '+fmt(inv.orderWaitSeconds/60)+' order-minutes.\u003c/p>'+\n      (firstWait?'\u003cbutton id=\"matJump\">Replay shortage at '+lotTime(firstWait.time)+'\u003c/button>':'')+comparison+\n      '\u003ch3>Lot balance\u003c/h3>\u003cp>Counts cover the full run. Stock is issued in delivery order, one material unit per order.\u003c/p>\u003cdiv class=\"datagrid\">\u003ctable>\u003ctr>\u003cth>Lot\u003c/th>\u003cth>Due\u003c/th>\u003cth>Received\u003c/th>\u003cth>Issued\u003c/th>\u003cth>Stock\u003c/th>\u003cth>Good shipped\u003c/th>\u003cth>Faulty shipped\u003c/th>\u003cth>Scrap\u003c/th>\u003cth>Rejected\u003c/th>\u003cth>In line\u003c/th>\u003c/tr>'+rows+'\u003c/table>\u003c/div>'+\n      '\u003ch3>Traceability\u003c/h3>\u003clabel>Supplier lot\u003cselect id=\"matPick\">\u003coption value=\"\">All orders\u003c/option>'+inv.lots.map((l,i)=>'\u003coption value=\"'+i+'\">'+escape(l.id)+'\u003c/option>').join('')+'\u003c/select>\u003c/label>\u003cp id=\"matMatches\">\u003c/p>\u003clabel>Order number\u003cinput type=\"number\" id=\"matOrder\" min=\"1\" step=\"1\">\u003c/label>\u003cdiv id=\"matGenealogy\" aria-live=\"polite\">\u003c/div>\u003cbutton id=\"matExport\">Export order and lot CSV\u003c/button>');\n    if(firstWait)$('matJump').onclick=()=>replay({time:firstWait.time,stationId:model.nodes.find(n=>n.type==='source').id,kind:'material shortage'});\n    function lookup(){\n      const job=inv.orders[$('matOrder').valueAsNumber-1],lot=$('matPick').value;\n      if(!job||(lot!==''&&job.lot!==inv.lots[Number(lot)].id)){$('matGenealogy').textContent='No matching order for this selection.';return;}\n      const events=(r.qualityTrace||[]).filter(e=>e.jobId===job.id);\n      $('matGenealogy').innerHTML='\u003cp>\u003cstrong>Order '+job.id+' · '+escape(job.status)+'\u003c/strong>\u003cbr>Lot '+escape(job.lot??'unassigned')+' · ordered '+lotTime(job.ordered)+(job.issued!=null?' · issued '+lotTime(job.issued):'')+(job.ended!=null?' · final disposition '+lotTime(job.ended):'')+'\u003c/p>'+events.map((e,i)=>'\u003cbutton data-material-event=\"'+i+'\">'+escape(e.kind)+' · '+escape(model.nodes.find(n=>n.id===e.stationId)?.name??e.stationId)+' · '+lotTime(e.time)+'\u003c/button>').join(' ');\n      document.querySelectorAll('[data-material-event]').forEach(b=>b.onclick=()=>replay(events[Number(b.dataset.materialEvent)]));\n    }\n    function choose(){\n      const lot=$('matPick').value,orders=lot===''?inv.orders:inv.orders.filter(j=>j.lot===inv.lots[Number(lot)].id);\n      $('matMatches').textContent=orders.length+' matching orders'+(orders.length?' · '+orders.slice(0,10).map(j=>'#'+j.id).join(', ')+(orders.length>10?' …':''):'');\n      $('matOrder').value=orders[0]?.id??'';lookup();\n    }\n    $('matPick').onchange=choose;$('matOrder').oninput=lookup;choose();\n    $('matExport').onclick=()=>{\n      const cell=v=>{let s=String(v??'');if(/^[=+@\\-\\t\\r]/.test(s))s=\"'\"+s;return '\"'+s.replaceAll('\"','\"\"')+'\"';};\n      const arr=[['Order','Product','Lot','Ordered s','Issued s','Ended s','Status'],...inv.orders.map(j=>[j.id,j.product,j.lot,j.ordered,j.issued,j.ended,j.status])];\n      download('flowstate-lot-trace.csv','\\ufeff'+arr.map(row=>row.map(cell).join(',')).join('\\r\\n'),'text/csv');\n    };\n  }\n  function schedule(){\n    const s=model.supply??{name:'Carton blank',lots:[{id:'LOT-A',at:0,quantity:30}]};\n    panel('schedule','\u003cform id=\"matForm\">\u003clabel>Material used at receiving\u003cinput id=\"matName\" value=\"'+escape(s.name)+'\" maxlength=\"80\" required>\u003c/label>\u003cp>One order consumes one unit of this material. Enter 0 seconds for opening stock. Orders wait at receiving when stock is empty. The current run ends at '+fmt(config.horizon)+' s.\u003c/p>\u003cdiv class=\"datagrid\">\u003ctable id=\"matTable\">\u003cthead>\u003ctr>\u003cth>Supplier lot ID\u003c/th>\u003cth>Delivery at (s)\u003c/th>\u003cth>Quantity\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"matLines\">\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"group\">\u003cbutton type=\"button\" id=\"matAdd\">Add delivery\u003c/button>\u003cbutton class=\"primary\">Save schedule and run\u003c/button>\u003c/div>\u003cp id=\"matError\" role=\"alert\">\u003c/p>\u003c/form>'+(model.supply?'\u003cbutton id=\"matUnlimited\">Use unlimited material\u003c/button>':''));\n    function add(l){\n      if($('matLines').children.length>=200){$('matError').textContent='Use at most 200 lots.';return;}\n      const row=document.createElement('tr');\n      row.innerHTML='\u003ctd>\u003cinput aria-label=\"Lot ID\" maxlength=\"64\" required value=\"'+escape(l.id)+'\">\u003c/td>\u003ctd>\u003cinput aria-label=\"Delivery second\" type=\"number\" min=\"0\" max=\"604800\" step=\"any\" required value=\"'+l.at+'\">\u003c/td>\u003ctd>\u003cinput aria-label=\"Lot quantity\" type=\"number\" min=\"1\" max=\"1000000\" step=\"1\" required value=\"'+l.quantity+'\">\u003c/td>\u003ctd>\u003cbutton type=\"button\">Remove\u003c/button>\u003c/td>';\n      row.querySelector('button').onclick=()=>row.remove();$('matLines').append(row);\n    }\n    s.lots.forEach(add);$('matAdd').onclick=()=>add({id:'',at:0,quantity:1});\n    $('matForm').onsubmit=e=>{\n      e.preventDefault();const name=$('matName').value.trim(),ids=new Set(),lots=[];\n      for(const row of $('matLines').children){\n        const [code,time,qty]=row.querySelectorAll('input'),id=code.value.trim();\n        if(!id||ids.has(id)){$('matError').textContent='Give every delivery a distinct lot ID.';return;}\n        ids.add(id);lots.push({id,at:time.valueAsNumber,quantity:qty.valueAsNumber});\n      }\n      if(!name){$('matError').textContent='Enter a material name.';return;}\n      apply({name,lots},inventory?summary(run):null);\n    };\n    if($('matUnlimited'))$('matUnlimited').onclick=()=>apply(null,null);\n  }\n  if(model.supply)review();else schedule();\n}\n","work-study.mjs":"// Times use seconds and travel distances use metres.\nexport const chartActivities = Object.freeze({\n  material: Object.freeze(['operation', 'transport', 'inspection', 'delay', 'storage', 'operation-inspection']),\n  worker: Object.freeze(['operation', 'move', 'delay', 'inspection']),\n  form: Object.freeze(['creation', 'operation', 'transport', 'inspection', 'delay', 'storage', 'disposal'])\n});\n\nfunction measured(value, label, positive = false) {\n  if (!Number.isFinite(value) || value \u003c 0 || (positive && value === 0)) {\n    throw new RangeError('Invalid ' + label);\n  }\n  return value;\n}\n\nexport function chartSummary(type, rows) {\n  if (!Object.hasOwn(chartActivities, type)) throw new RangeError('Unknown chart type');\n  const counts = Object.fromEntries(chartActivities[type].map(activity => [activity, 0]));\n  let seconds = 0;\n  let metres = 0;\n  for (const row of rows) {\n    if (!Object.hasOwn(counts, row.activity)) throw new RangeError('Invalid activity for ' + type);\n    counts[row.activity]++;\n    seconds += measured(row.seconds, 'step time');\n    metres += measured(row.metres, 'step distance');\n  }\n  return { counts, steps: rows.length, seconds, metres };\n}\n\nexport function compareMethods(type, presentRows, proposedRows) {\n  const present = chartSummary(type, presentRows);\n  const proposed = chartSummary(type, proposedRows);\n  const counts = Object.fromEntries(chartActivities[type].map(activity =>\n    [activity, present.counts[activity] - proposed.counts[activity]]));\n  return { present, proposed, savings: { counts, steps: present.steps - proposed.steps,\n    seconds: present.seconds - proposed.seconds, metres: present.metres - proposed.metres } };\n}\n\nexport function productivity(output, input) {\n  return measured(output, 'output') / measured(input, 'input', true);\n}\n\n// Use the same currency and observation period for output value and all costs.\nexport function totalProductivity(outputValue, inputCosts) {\n  return productivity(outputValue, inputCosts.reduce((sum, cost) => sum + measured(cost, 'input cost'), 0));\n}\n\nexport function timeStudy(observations, ratingPercent, allowancePercent, basis = 'normal-time') {\n  if (!observations.length) throw new RangeError('At least one observation required');\n  const observed = observations.reduce((sum, t) => sum + measured(t, 'cycle time', true), 0) / observations.length;\n  const normal = observed * measured(ratingPercent, 'performance rating', true) / 100;\n  const allowance = measured(allowancePercent, 'allowance') / 100;\n  if (!['normal-time', 'shift-time'].includes(basis) || (basis === 'shift-time' && allowance >= 1)) {\n    throw new RangeError('Invalid allowance basis or percentage');\n  }\n  const standard = basis === 'normal-time' ? normal * (1 + allowance) : normal / (1 - allowance);\n  return { observed, normal, standard, cyclesPerHour: 3600 / standard };\n}\n\nexport function samplingShares(counts) {\n  const entries = Object.entries(counts);\n  for (const [, count] of entries) {\n    if (!Number.isSafeInteger(count) || count \u003c 0) throw new RangeError('Invalid observation count');\n  }\n  const total = entries.reduce((sum, [, count]) => sum + count, 0);\n  if (!total) throw new RangeError('At least one observation required');\n  return Object.fromEntries(entries.map(([category, count]) => [category, count / total]));\n}\n\n// Trace aisle turns as waypoints on the scaled plan.\nexport function routeDistance(points, metresPerDrawingUnit) {\n  const scale = measured(metresPerDrawingUnit, 'layout scale', true);\n  let length = 0;\n  for (const [i, point] of points.entries()) {\n    if (!Number.isFinite(point.x) || !Number.isFinite(point.y)) throw new RangeError('Invalid route point');\n    if (i) length += Math.hypot(point.x - points[i - 1].x, point.y - points[i - 1].y);\n  }\n  return length * scale;\n}\n","study-lab.mjs":"import {chartActivities,compareMethods,timeStudy,routeDistance,samplingShares,productivity,totalProductivity} from './work-study.mjs';\n\nconst topics = {\n  overview: ['Study record', 'Select the job, record the present method, examine its purpose, place, sequence, person and means, then develop, install and maintain the improved method. Record what you directly observed.'],\n  material: ['Material process chart', 'Follow one material from receipt to completion. A combined operation and inspection is one recorded step.'],\n  worker: ['Worker process chart', 'Follow one worker. Distinguish a required move between workstations from a delay or movement within a workstation.'],\n  form: ['Form process chart', 'Follow one document from creation to disposal. Record filing separately from temporary waiting.'],\n  operations: ['Operations chart', 'Trace the main component through fabrication, assembly and packing. Record purchased parts at the operation where they join. Compare pieces per hour for each operation.'],\n  layout: ['Flow diagram', 'Mark the actual route in order on the floor plan, including aisle turns. Calibrate the drawing scale. Examine crossings, backtracking and congestion before proposing a new layout.'],\n  timing: ['Direct time study', 'Describe a repeatable method and observe a qualified worker. Rate the worker-controlled time, then add allowances for personal needs, fatigue and unavoidable delays.'],\n  standards: ['Motion and standard data', 'For predetermined motion times, list basic motions with values from your chosen reference. For standard data, use previously established normal element times for comparable conditions. Document each source.'],\n  sampling: ['Work sampling', 'Define mutually exclusive activities and observe at randomly chosen times across a representative period. The proportion of observations estimates the share of time in each category.'],\n  productivity: ['Productivity', 'Compare output with the resources used in the same period. A gain in labor productivity can coincide with increased material or machine costs. Use one currency for total productivity.']\n};\nconst methods=['Present','Proposed'];\nconst guides={\n  overview:'What changed in the material, equipment, operator training or working conditions? When should the standard be measured again?',\n  operations:'Could the material specification change? Which parts should be made or purchased? Which operations can be eliminated, combined, rearranged or simplified?',\n  material:'Which transports, delays or inspections could be removed? Can the inspection take place during an operation?',\n  worker:'Which movements add distance? Could tools or materials be repositioned to reduce waiting and travel?',\n  form:'Which copies, approvals or handoffs are redundant? Can the same record serve more than one purpose?',\n  layout:'Where do routes cross, reverse or compete for aisle space? How would rerouting affect distance, handling and safety?',\n  timing:'Why is this worker and method representative? Separate recurring and irregular work. How were personal, fatigue and unavoidable delay allowances established?',\n  standards:'How closely do the reference conditions match this method? Estimates and historical records may lack a performance rating. Record the units and convert to seconds before entry.',\n  sampling:'What population and period do the observations represent? Could the sampling schedule miss a shift or part of a cycle?',\n  productivity:'Which technical, production, organizational, personnel, finance, management, government or location factor could explain the change? Compare present and proposed results and name the action you would maintain.'\n};\nconst fields={\n  overview:[['activity','Activity or product'],['observer','Observer / IE'],['date','Study date','date'],['location','Location'],['start','Starting point'],['end','Ending point'],['approved','Approved by'],['method','Standard method, tools and conditions'],['analysis','Analysis and improvement opportunities'],['conclusion','Conclusion and follow-up']],\n  timing:[['observations','Observed manual seconds per cycle (comma-separated)'],['rating','Performance rating (%)','number',100],['allowance','Manual allowance (%)','number',0],['basis','Allowance basis',['normal-time','shift-time']],['machine','Sequential machine-controlled seconds per cycle','number',0],['machineAllowance','Machine allowance on machine time (%)','number',0]],\n  productivity:[['output','Finished units','number'],['value','Output value (₱)','number'],['labor','Labor hours','number'],['material','Material used (kg)','number'],['machine','Machine hours','number'],['capital','Capital employed (₱)','number'],...['Labor','Material','Machine','Capital','Other'].map(k=>[k+'Cost',k+' input cost for the period (₱)','number',0])],\n  layout:[['scale','Metres per drawing unit','number',1]],\n  standards:[['system','Source system',['Predetermined motion times','Standard data']],['allowance','Allowance on normal time (%)','number',0]],\n};\nconst columns={\n  operations:[['part','Part / branch'],['kind','Part type',['Fabricated','Buyout']],['task','Operation or purchased item'],['join','Feeds operation #','integer'],['seconds','Seconds / cycle','number'],['qty','Pieces / cycle','number',1]],\n  layout:[['label','Waypoint'],['x','Floor X','coordinate'],['y','Floor Y','coordinate']],\n  standards:[['element','Motion / element'],['source','Reference and conditions'],['seconds','Normal seconds','number'],['frequency','Occurrences / cycle','number',1]],\n  sampling:[['label','Observed activity'],['count','Observation count','integer']],\n};\nfor(const [type,activities] of Object.entries(chartActivities)){\n  columns[type]=[['description','Step description'],['activity','Classification',activities],['qty','Quantity','number',1],['metres','Distance (m)','number',0],['seconds','Time (s)','number',0],['remarks','Remarks']];\n}\nconst num=(v,positive=false)=>{\n  if(v==null||String(v).trim()===''||!Number.isFinite(Number(v))||Number(v)\u003c0||(positive&&Number(v)===0))throw Error('Enter valid measurements in all required numeric fields.');\n  return Number(v);\n};\nconst format=n=>Number(n.toFixed(3)).toLocaleString();\nfunction numericRows(rows){\n  return rows.map(r=>({...r,seconds:num(r.seconds),metres:num(r.metres),qty:num(r.qty)}));\n}\nfunction duration(t){\n  const manual=timeStudy(String(t.observations||'').split(',').map(v=>num(v,true)),num(t.rating,true),num(t.allowance),t.basis);\n  const machine=num(t.machine)*(1+num(t.machineAllowance)/100);\n  return {...manual,standard:manual.standard+machine};\n}\nfunction standardFromData(t){\n  if(!t.rows.length||t.rows.some(r=>!r.element?.trim()||!r.source?.trim()))throw Error('Enter an element and a reference for each time value.');\n  const normal=t.rows.reduce((s,r)=>s+num(r.seconds,true)*num(r.frequency,true),0);\n  return {normal,standard:normal*(1+num(t.allowance)/100)};\n}\nfunction blankTopic(key){\n  const obj={rows:[]};\n  for(const [id,,type,initial] of fields[key]||[])obj[id]=initial??(Array.isArray(type)?type[0]:'');\n  return obj;\n}\n\n// Use one completed job so branching and repeated visits stay in event order.\nexport function simulationWorksheet(topic,model,run,stationId,workerId=1,from=run.config.warmup,to=run.config.horizon){\n  const name=id=>model.nodes.find(n=>n.id===id)?.name||id;\n  const stamp='Simulation · seed '+run.config.seed+' · observation window '+run.config.warmup+'–'+run.config.horizon+' s';\n  const end=run.eventLog.find(ev=>ev.type==='departure'&&ev.time>=run.config.warmup);\n  const context=stamp+' · '+run.completed+' completed · bottleneck '+name(run.bottleneck);\n  if(topic==='worker'&&run.workers?.length){\n    if(!Number.isFinite(from)||!Number.isFinite(to)||from\u003crun.config.warmup||to>run.config.horizon||to\u003c=from)throw Error('Choose a positive observation window within the measured run.');\n    const worker=run.workers.find(w=>w.id===workerId);if(!worker)throw Error('Choose a worker from this run.');\n    const rows=[];\n    for(const i of worker.intervals){\n      const start=Math.max(i.start,from),end=Math.min(i.end,to);if(end\u003c=start)continue;\n      const activity=i.kind==='Walking'?'move':i.kind==='Working'?(model.nodes.find(n=>n.id===i.to)?.type==='inspection'?'inspection':'operation'):'delay';\n      rows.push({description:i.kind+' · '+(i.from===i.to?name(i.to):name(i.from)+' → '+name(i.to)),activity,qty:1,seconds:end-start,metres:(i.distance||0)*(end-start)/(i.end-i.start),remarks:'W'+worker.id+' · '+format(start)+'–'+format(end)+' s'+(i.job?' · unit '+i.job:'')});\n      if(rows.length>500)throw Error('Choose a shorter observation window (500 activities maximum per worksheet).');\n    }\n    return {rows,provenance:stamp+' · worker '+worker.id+(worker.role?' ('+worker.role+')':'')+' · observed '+from+'–'+to+' s · simulated worker activity.'};\n  }\n  if(['worker','form','standards'].includes(topic))return {provenance:context+'. Record actual worker movement, document handling or reference times separately.'};\n  if(topic==='sampling'){\n    const track=run.tracks[stationId]||[];\n    if(!track.length)throw Error('Select a processing station in the studio first.');\n    // Stratified pseudo-random observation times within the recorded run.\n    let seed=run.config.seed>>>0,i=0,busy=0;\n    const node=model.nodes.find(n=>n.id===stationId);\n    for(let k=0;k\u003c100;k++){\n      seed=(Math.imul(1664525,seed)+1013904223)>>>0;\n      const t=run.config.warmup+(k+seed/4294967296)*(run.config.horizon-run.config.warmup)/100;\n      while(i+1\u003ctrack.length&&track[i+1].time\u003c=t)i++;\n      if(track[i].time\u003c=t&&track[i].busy>0&&!(node.pauseLength&&t>=node.pauseStart&&t\u003cnode.pauseStart+node.pauseLength))busy++;\n    }\n    return {rows:[{label:'Station busy',count:busy},{label:'Idle or stopped',count:100-busy}],provenance:stamp+' · 100 simulated observations at '+name(stationId)};\n  }\n  if(topic==='timing'){\n    const starts=new Map(),times=[];\n    for(const ev of run.eventLog){\n      if(ev.stationId!==stationId)continue;\n      if(ev.type==='service-start'&&ev.time>=run.config.warmup)starts.set(ev.jobId,ev.time);\n      if(ev.type==='service-complete'&&starts.has(ev.jobId)){\n        times.push(Number((ev.time-starts.get(ev.jobId)).toFixed(6)));starts.delete(ev.jobId);\n        if(times.length===30)break;\n      }\n    }\n    if(!times.length)throw Error('No complete cycles recorded for this station in the observation window.');\n    return {observations:times.join(', '),provenance:stamp+' · '+name(stationId)+' · simulated elapsed cycles, including any planned stops.'};\n  }\n  if(!end)throw Error('No completed job in the recorded event log for this window.');\n  const trace=run.eventLog.filter(ev=>ev.jobId===end.jobId);\n  const rows=[];let queued,started;\n  for(const ev of trace){\n    const node=model.nodes.find(n=>n.id===ev.stationId);\n    if(topic==='layout'&&['arrival','service-start','departure'].includes(ev.type)&&node)rows.push({label:node.name,x:node.x,y:node.y});\n    if(ev.type==='queued')queued=ev.time;\n    if(ev.type==='service-start'){\n      if(topic==='material'&&queued!=null&&ev.time>queued)rows.push({description:'Wait at '+name(ev.stationId),activity:'delay',qty:1,metres:0,seconds:ev.time-queued});\n      queued=null;started=ev.time;\n    }\n    if(ev.type==='service-complete'&&started!=null){\n      const seconds=ev.time-started;\n      if(topic==='material')rows.push({description:name(ev.stationId),activity:node?.type==='inspection'?'inspection':'operation',qty:1,metres:0,seconds});\n      if(topic==='operations')rows.push({part:'Product '+end.productId,kind:'Fabricated',task:name(ev.stationId),qty:1,seconds,join:''});\n      started=null;\n    }\n  }\n  return {rows,provenance:stamp+' · simulated job '+end.jobId+' · product '+end.productId+'. Confirm physical distances and component relationships by observation.'};\n}\n\nexport function openStudy({model,run,selected,topic='overview',initialWorker=1,range=null,draftKey,getRevision,modal,commit,escape:e,notify,rerun}){\n  let draft=structuredClone(model.workStudy||{Present:{},Proposed:{}});\n  let recovered=false;\n  try{const saved=JSON.parse(localStorage.getItem(draftKey));if(saved?.revision===getRevision()&&saved.data?.Present&&saved.data?.Proposed){draft=saved.data;recovered=true;}}catch{}\n  const discardDraft=()=>{try{localStorage.removeItem(draftKey);}catch{}};\n  function checkpoint(){\n    try{localStorage.setItem(draftKey,JSON.stringify({revision:getRevision(),data:draft}));}\n    catch{const status=id('status');if(status)status.textContent='Draft recovery unavailable. Save study and export the project.';}\n  }\n  let method='Present';\n  let station=selected,workerId=initialWorker,from=run?.config.warmup||0,to=run?Math.min(run.config.horizon,run.config.warmup+300):0;\n  if(range){from=range.from;to=range.to;}\n  const methodTimes=m=>draft[m].stationTimes||{};\n  const get=(k=topic,m=method)=>draft[m][k]??=(blankTopic(k));\n  let watchStart=null;\n  const id=v=>document.getElementById('ws-'+v);\n  const svg=(body,vb)=>'\u003csvg role=\"img\" aria-label=\"'+e(topics[topic][0])+'\" viewBox=\"'+vb+'\" style=\"width:100%;min-height:130px;background:#f4f8f6\">'+body+'\u003c/svg>';\n  function graphic(t,key){\n    if(key==='layout'){\n      const pts=t.rows.map(r=>{\n        if([r.x,r.y].some(v=>v==null||String(v).trim()===''||!Number.isFinite(Number(v))))throw Error('Enter both coordinates for each waypoint.');\n        return {x:Number(r.x),y:Number(r.y)};\n      });\n      const length=routeDistance(pts,num(t.scale,true));\n      if(!pts.length&&!model.nodes.length)return 'Add a waypoint to start the route.';\n      const xs=[...pts.map(p=>p.x),...model.nodes.map(n=>n.x)],ys=[...pts.map(p=>p.y),...model.nodes.map(n=>n.y)];\n      const minX=Math.min(...xs)-25,minY=Math.min(...ys)-30,w=Math.max(150,Math.max(...xs)-minX+120),h=Math.max(100,Math.max(...ys)-minY+40);\n      const stations=model.nodes.map(n=>'\u003cg>\u003crect x=\"'+Number(n.x)+'\" y=\"'+Number(n.y)+'\" width=\"90\" height=\"20\" fill=\"#cfdfda\"/>\u003ctext x=\"'+(Number(n.x)+3)+'\" y=\"'+(Number(n.y)+14)+'\" font-size=\"10\">'+e(n.name)+'\u003c/text>\u003c/g>').join('');\n      return '\u003cstrong>'+format(length)+' m travelled\u003c/strong>'+svg(stations+'\u003cpolyline points=\"'+pts.map(p=>p.x+','+p.y).join(' ')+'\" fill=\"none\" stroke=\"#23785a\" stroke-width=\"3\"/>'+pts.map((p,i)=>'\u003ccircle cx=\"'+p.x+'\" cy=\"'+p.y+'\" r=\"4\" fill=\"#175648\"/>\u003ctext x=\"'+(p.x+5)+'\" y=\"'+(p.y-5)+'\" font-size=\"11\">'+(i+1)+' '+e(t.rows[i].label)+'\u003c/text>').join(''),[minX,minY,w,h].join(' '));\n    }\n    const parts=[...new Set(t.rows.map(r=>r.part||'Part'))], pos=i=>({x:100+180*(parts.length-1-parts.indexOf(t.rows[i].part||'Part')),y:35+i*65});\n    let edges='',nodes=''; const last=new Map();\n    for(const [i,r] of t.rows.entries()){\n      const {x,y}=pos(i),buy=r.kind==='Buyout',prior=last.get(r.part);\n      if(prior!==undefined)edges+='\u003cpath d=\"M '+x+' '+pos(prior).y+' V '+y+'\" stroke=\"#668\"/>';\n      last.set(r.part,i);\n      if(r.join){const j=num(r.join,true)-1;if(!Number.isInteger(j)||j\u003c=i||j>=t.rows.length)throw Error('A component must feed a later operation number.');const q=pos(j);edges+='\u003cpath d=\"M '+x+' '+y+' V '+q.y+' H '+q.x+'\" fill=\"none\" stroke=\"#287a67\"/>';}\n      const rate=buy?'Purchased':format(3600*num(r.qty,true)/num(r.seconds,true))+' pieces/h';\n      nodes+=(buy?'\u003crect x=\"'+(x-13)+'\" y=\"'+(y-12)+'\" width=\"26\" height=\"24\" fill=\"#d6e2dc\"/>':'\u003ccircle cx=\"'+x+'\" cy=\"'+y+'\" r=\"13\" fill=\"#dbedce\" stroke=\"#28644d\"/>')+'\u003ctext x=\"'+x+'\" y=\"'+(y+4)+'\" text-anchor=\"middle\">'+(i+1)+'\u003c/text>\u003ctext x=\"'+x+'\" y=\"'+(y+25)+'\" text-anchor=\"middle\" font-size=\"11\">'+e(r.part)+' · '+e(r.task)+'\u003c/text>\u003ctext x=\"'+x+'\" y=\"'+(y+39)+'\" text-anchor=\"middle\" font-size=\"10\">'+rate+'\u003c/text>';\n    }\n    return t.rows.length?svg(edges+nodes,'0 0 '+(parts.length*180+25)+' '+(t.rows.length*65+20)):'Add a component or operation.';\n  }\n  function output(k,t,m){\n    if(Object.hasOwn(chartActivities,k)){\n      const other=m==='Present'?'Proposed':'Present';\n      const current=numericRows(t.rows),peer=numericRows(get(k,other).rows);\n      const c=compareMethods(k,m==='Present'?current:peer,m==='Proposed'?current:peer);\n      const rows=[['Steps','steps'],['Seconds','seconds'],['Metres','metres']];\n      const row=(name,values)=>'\u003ctr>\u003cth>'+e(name)+'\u003c/th>'+values.map(n=>'\u003ctd>'+format(n)+'\u003c/td>').join('')+'\u003c/tr>';\n      const summaries=[c.present,c.proposed,c.savings];\n      const quantities=[current,peer].map(list=>list.reduce((sum,r)=>sum+r.qty,0));\n      if(m==='Proposed')quantities.reverse();\n      return '\u003ctable>\u003ctr>\u003cth>Measure\u003c/th>\u003cth>Present\u003c/th>\u003cth>Proposed\u003c/th>\u003cth>Saving\u003c/th>\u003c/tr>'+rows.map(([l,v])=>row(l,summaries.map(x=>x[v]))).join('')+row('Quantity across steps', [...quantities,quantities[0]-quantities[1]])+chartActivities[k].map(a=>row(a,summaries.map(x=>x.counts[a]))).join('')+'\u003c/table>'+(peer.length?'':'Record both methods before interpreting savings.');\n    }\n    if(k==='layout'||k==='operations'){\n      let drawing=graphic(t,k);\n      if(k==='layout'&&methods.every(m=>draft[m].layout?.rows.length)){\n        const lengths=methods.map(m=>{const l=draft[m].layout;return routeDistance(l.rows.map(r=>({x:Number(r.x),y:Number(r.y)})),num(l.scale,true));});\n        drawing+='\u003cp>Present '+format(lengths[0])+' m · Proposed '+format(lengths[1])+' m · Distance saved '+format(lengths[0]-lengths[1])+' m\u003c/p>';\n      }\n      return drawing;\n    }\n    if(k==='timing'||k==='standards'){\n      const v=k==='timing'?duration(t):standardFromData(t);\n      return (k==='timing'?'Mean observed manual time '+format(v.observed)+' s · ':'')+'Normal '+(k==='timing'?'manual ':'')+'time '+format(v.normal)+' s · \u003cb>Standard cycle '+format(v.standard)+' s\u003c/b> · '+format(3600/v.standard)+' cycles/h';\n    }\n    if(k==='sampling'){\n      const counts=new Map();for(const r of t.rows){if(!r.label?.trim())throw Error('Name each activity.');const n=num(r.count);if(!Number.isSafeInteger(n))throw Error('Use whole observation counts.');counts.set(r.label,(counts.get(r.label)||0)+n);}\n      return Object.entries(samplingShares(Object.fromEntries(counts))).map(([name,share])=>e(name)+' · '+format(100*share)+'%').join('\u003cbr>');\n    }\n    if(k==='productivity'){\n      const units={labor:'labor h',material:'kg',machine:'machine h',capital:'₱ capital'};\n      const partial=Object.entries(units).filter(([k])=>t[k]!==''&&t[k]!=null).map(([k,u])=>format(productivity(num(t.output),num(t[k],true)))+' units / '+u);\n      if(t.value!=='')partial.push('Total productivity · '+format(totalProductivity(num(t.value),['Labor','Material','Machine','Capital','Other'].map(k=>num(t[k+'Cost']))))+' ₱ output / ₱ input');\n      return partial.join('\u003cbr>')||'Enter output and at least one input for the same period.';\n    }\n    return '';\n  }\n  function safeOutput(k,t,m){try{return output(k,t,m);}catch(err){return e(err.message);}}\n  const control=(spec,value,attr)=>{\n    const [key,label,type]=spec,a=' aria-label=\"'+e(label)+'\" data-key=\"'+key+'\" '+attr;\n    if(Array.isArray(type))return '\u003cselect '+a+'>'+type.map(o=>'\u003coption'+(o===value?' selected':'')+'>'+e(o)+'\u003c/option>').join('')+'\u003c/select>';\n    const numeric=['number','integer','coordinate'].includes(type);\n    return '\u003cinput '+a+' type=\"'+(numeric?'number':type==='date'?'date':'text')+'\" '+(numeric?'step=\"'+(type==='integer'?'1':'any')+'\" '+(type==='coordinate'?'':'min=\"0\"'):'')+' value=\"'+e(value)+'\">';\n  };\n  function refresh(){\n    const t=get(),cols=columns[topic]||[], form=fields[topic]||[];\n    const select=(name,opts,active)=>'\u003cselect id=\"ws-'+name+'\">'+opts.map(([k,v])=>'\u003coption value=\"'+e(k)+'\"'+(active===k?' selected':'')+'>'+e(v)+'\u003c/option>').join('')+'\u003c/select>';\n    const node=model.nodes.find(n=>n.id===station);\n    const snapshot=draft[method].evidence;\n    const source='\u003cdiv class=\"study-source\">\u003cdiv>\u003cstrong>'+e(model.title)+'\u003c/strong>\u003csmall>'+(run?e(run.completed)+' completed · '+e(format(run.throughput))+' units/h · seed '+e(run.config.seed):'Run the simulation to capture evidence')+'\u003c/small>\u003c/div>'+(run?'\u003cbutton id=\"ws-capture\">Capture '+method.toLowerCase()+' run\u003c/button>':'')+'\u003c/div>';\n    const paired=draft.Present.evidence&&draft.Proposed.evidence;\n    const evidence=snapshot?'\u003cp class=\"study-evidence\">Saved '+e(method.toLowerCase())+' run · '+e(snapshot.completed)+' units · '+e(format(snapshot.rate))+' units/h'+(paired?' · Proposed throughput change '+e(format(draft.Proposed.evidence.rate-draft.Present.evidence.rate))+' units/h':'')+'\u003c/p>':'';\n    const stations=model.nodes.filter(n=>['processor','inspection'].includes(n.type));\n    modal('Work study','\u003csection id=\"ws-lab\">'+source+evidence+'\u003cdiv class=\"ws-tools\">\u003clabel>Worksheet '+select('topic',Object.entries(topics).map(([k,v])=>[k,v[0]]),topic)+'\u003c/label>\u003clabel>Method '+select('method',methods.map(m=>[m,m]),method)+'\u003c/label>\u003c/div>\u003cp>'+e(topics[topic][1])+'\u003c/p>\u003cdiv class=\"ws-fields\">'+form.map(f=>'\u003clabel>'+e(f[1])+control(f,t[f[0]],'')+'\u003c/label>').join('')+'\u003c/div>'+\n      (cols.length?'\u003cdiv class=\"ws-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>'+cols.map(c=>'\u003cth>'+e(c[1])+'\u003c/th>').join('')+'\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+t.rows.map((r,i)=>'\u003ctr>\u003ctd>'+(i+1)+'\u003c/td>'+cols.map(c=>'\u003ctd>'+control(c,r[c[0]],'data-row=\"'+i+'\"')+'\u003c/td>').join('')+'\u003ctd>\u003cbutton data-remove=\"'+i+'\" aria-label=\"Remove row '+(i+1)+'\">×\u003c/button>\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>\u003cbutton id=\"ws-add\">Add row\u003c/button>':'')+\n
